# Minimal JobSet API for envtest. The controller reads workloads as
# unstructured objects and read only metadata and status. The schema preserves unknown
# fields so the controller sees what the test writes; it does not check
# fidelity with the upstream JobSet schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobsets.jobset.x-k8s.io
spec:
  group: jobset.x-k8s.io
  names:
    kind: JobSet
    listKind: JobSetList
    plural: jobsets
    singular: jobset
  scope: Namespaced
  versions:
    - name: v1alpha2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
