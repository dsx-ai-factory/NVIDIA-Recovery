# Minimal PyTorchJob API for envtest. The controller reads workloads as
# unstructured objects and read only metadata and status.conditions.
# The schema preserves unknown fields so the controller sees what the test
# writes; it does not check fidelity with the upstream Kubeflow schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pytorchjobs.kubeflow.org
spec:
  group: kubeflow.org
  names:
    kind: PyTorchJob
    listKind: PyTorchJobList
    plural: pytorchjobs
    singular: pytorchjob
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
