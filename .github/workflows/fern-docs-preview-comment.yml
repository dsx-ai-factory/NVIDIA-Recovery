# Workflow 2 of 2 for hosted Fern documentation previews.
#
# Runs after "Preview Fern Docs: Build" completes, downloads the staged Fern
# inputs, builds a hosted preview with the Fern token, and posts or updates one
# comment on the pull request. This workflow never checks out the pull request
# branch, so the token is not exposed to repository scripts. Everything it
# downloads is treated as data: the pull request number and Fern CLI version
# are validated before use.
#
# Required configuration:
# - Secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern organization)
#
# This workflow only runs from the default branch, so changes to it take effect
# after they merge.

name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Preview Fern Docs: Build"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  preview:
    name: Build and comment Fern preview
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Fern sources and metadata
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fern-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate pull request metadata
        id: metadata
        run: |
          set -euo pipefail
          pr_number=$(cat preview-metadata/pr_number)
          head_ref=$(cat preview-metadata/head_ref)
          case "$pr_number" in
            ''|*[!0-9]*) echo "::error::Invalid pull request number in artifact"; exit 1 ;;
          esac
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The version comes from the downloaded artifact. Accept only a plain
      # semantic version so artifact content cannot select another package.
      - name: Install the pinned Fern CLI
        run: |
          set -euo pipefail
          version=$(node -p "require('./fern/fern.config.json').version")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected Fern CLI version in artifact: ${version}"
            exit 1
          fi
          npm install -g "fern-api@${version}"

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          HEAD_REF: ${{ steps.metadata.outputs.head_ref }}
        working-directory: ./fern
        run: |
          set -euo pipefail
          # The preview id becomes part of the hostname, so '/' and other
          # characters outside the DNS-safe set are replaced.
          PREVIEW_ID=$(echo "${HEAD_REF:-preview}" | sed 's/[^a-zA-Z0-9._-]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')
          PREVIEW_ID="${PREVIEW_ID:-preview}"

          # Fern can exit non-zero on documentation diagnostics even after it
          # logs a preview URL. Capture the output so the URL check below is
          # the authority and a missing URL fails with Fern's output visible.
          set +e
          OUTPUT=$(fern generate --docs --preview --force --id "$PREVIEW_ID" 2>&1)
          FERN_EXIT=$?
          set -e
          echo "$OUTPUT"

          URL=$(echo "$OUTPUT" | grep -oE 'Published docs to https?://[^[:space:]()]+' | head -1 | sed 's/^Published docs to //') || true
          if [ -z "$URL" ]; then
            echo "::error::Failed to generate preview URL (fern exit ${FERN_EXIT}). See Fern output above."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build page links for changed Markdown files
        id: page-links
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
        run: |
          CHANGED_FILES=""
          if [ -f preview-metadata/changed_md_files ]; then
            CHANGED_FILES=$(cat preview-metadata/changed_md_files)
          fi

          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BASE_URL=$(echo "$PREVIEW_URL" | grep -oP 'https?://[^/]+')
          FILES_PARAM=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//' \
            | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=',/'))")
          RESPONSE=$(curl -sf -H "FERN_TOKEN: $FERN_TOKEN" "${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}" 2>/dev/null) || {
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          }

          PAGE_LINKS=$(echo "$RESPONSE" | jq -r --arg url "$BASE_URL" \
            '.mappings[] | select(.slug != null) | "- [\(.slug)](\($url)/\(.slug))"')

          if [ -n "$PAGE_LINKS" ]; then
            { echo "page_links<<EOF"; echo "$PAGE_LINKS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "page_links=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update pull request comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
          PAGE_LINKS: ${{ steps.page-links.outputs.page_links }}
        run: |
          BODY=":herb: **Preview your docs:** <${PREVIEW_URL}>"
          if [ -n "${PAGE_LINKS}" ]; then
            BODY="${BODY}

          Here are the documentation pages you've updated:
          ${PAGE_LINKS}"
          fi

          # A hidden marker lets later pushes update this comment in place.
          MARKER="<!-- preview-docs -->"
          BODY="${BODY}

          ${MARKER}"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | tr -d '\r' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
