global:
  imagePullSecrets: []
  log_query:
    backend: loki
    providers:
      loki:
        application:
          url: http://heimdall-loki:3100
          tenants: ""
          org_id: ""
        system:
          url: http://heimdall-loki:3100
          tenants: ""
          org_id: ""
  prometheus: &prometheus_info
    prometheus_url: "http:/heimdall-prometheus-server"
    prometheus_cluster: ""
    pod_monitor_enabled: false
  mysql:
    database: &mysql_database heimdall
    username: &mysql_username heimdall
    password: &mysql_password heimdall
  rabbitmq:
    username: &rabbitmq_username heimdall
    vhost: &rabbitmq_vhost default-vhost
enableExtendedLabelSelectors: true
db:
  database: *mysql_database
  user: *mysql_username
