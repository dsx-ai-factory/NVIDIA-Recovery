services:
  mysql:
    image: mariadb:10.10
    hostname: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - var_lib_mysql:/var/lib/mysql

  mock-heimdall:
    image: slurm-advisor-controller-controller:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["mock-heimdall-gateway"]
    hostname: mock-heimdall
    environment:
      MOCK_HEIMDALL_GRPC_ADDR: ":8080"
      MOCK_HEIMDALL_DEBUG_ADDR: ":8081"
    ports:
      - "127.0.0.1:${MOCK_HEIMDALL_DEBUG_PORT:-18081}:8081"

  mock-heimdall-peer:
    profiles: ["environment-isolation"]
    image: slurm-advisor-controller-controller:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["mock-heimdall-gateway"]
    hostname: mock-heimdall-peer
    environment:
      MOCK_HEIMDALL_GRPC_ADDR: ":8080"
      MOCK_HEIMDALL_DEBUG_ADDR: ":8081"
    ports:
      - "127.0.0.1:${MOCK_HEIMDALL_PEER_DEBUG_PORT:-18082}:8081"

  slurmdbd:
    image: slurm-advisor-controller-slurm-base:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurmdbd"]
    hostname: slurmdbd
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      - mysql

  slurmctld:
    image: slurm-advisor-controller-slurm-base:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurmctld"]
    hostname: slurmctld
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - ./jobs:/jobs:ro
      - slurm_jobdir:/data
      - slurm_loglinks:/log-links
      - var_log_slurm:/var/log/slurm
    expose:
      - "6817"
    depends_on:
      - slurmdbd

  c1:
    image: slurm-advisor-controller-slurm-base:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurmd"]
    hostname: c1
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - ./jobs:/jobs:ro
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - slurmctld

  c2:
    image: slurm-advisor-controller-slurm-base:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurmd"]
    hostname: c2
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - ./jobs:/jobs:ro
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - slurmctld

  c3:
    image: slurm-advisor-controller-slurm-base:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurmd"]
    hostname: c3
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - ./jobs:/jobs:ro
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - slurmctld

  controller:
    image: slurm-advisor-controller-controller:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurm-advisor-controller"]
    hostname: controller
    environment:
      HEIMDALL_ENDPOINT: mock-heimdall:8080
      SLURM_ADVISOR_MODE: ${SLURM_ADVISOR_MODE:-observe}
      SLURM_ADVISOR_LOG_LEVEL: ${SLURM_ADVISOR_LOG_LEVEL:-info}
      SLURM_ADVISOR_METRICS_ENABLED: ${SLURM_ADVISOR_METRICS_ENABLED:-true}
      SLURM_ADVISOR_METRICS_ADDR: ":9090"
      SLURM_ADVISOR_POLL_INTERVAL: ${SLURM_ADVISOR_POLL_INTERVAL:-2s}
      SLURM_ADVISOR_LOG_METADATA_REFRESH_INTERVAL: ${SLURM_ADVISOR_LOG_METADATA_REFRESH_INTERVAL:-5m}
      SLURM_ADVISOR_LOG_METADATA_ENRICHMENT_TIMEOUT: ${SLURM_ADVISOR_LOG_METADATA_ENRICHMENT_TIMEOUT:-2s}
      SLURM_ADVISOR_JOB_UPSERT_WORKER_POOL_SIZE: ${SLURM_ADVISOR_JOB_UPSERT_WORKER_POOL_SIZE:-8}
      SLURM_ADVISOR_ACCOUNTING_WORKER_POOL_SIZE: ${SLURM_ADVISOR_ACCOUNTING_WORKER_POOL_SIZE:-8}
      SLURM_ADVISOR_ACCOUNTING_TIMEOUT: ${SLURM_ADVISOR_ACCOUNTING_TIMEOUT:-5m}
      SLURM_ADVISOR_ADVICE_LOOP_TIMEOUT: ${SLURM_ADVISOR_ADVICE_LOOP_TIMEOUT:-10s}
      SLURM_ADVISOR_ENVIRONMENT: ${SLURM_ADVISOR_ENVIRONMENT:-unspecified}
      SLURM_ADVISOR_ACKNOWLEDGE_SCHEDULER_ACTIONS: ${SLURM_ADVISOR_ACKNOWLEDGE_SCHEDULER_ACTIONS:-false}
      SLURM_ADVISOR_ENABLE_EAGER_REQUEUE: ${SLURM_ADVISOR_ENABLE_EAGER_REQUEUE:-false}
      SLURM_ADVISOR_UPDATE_ELIGIBLE_TIME_AFTER_REQUEUE: ${SLURM_ADVISOR_UPDATE_ELIGIBLE_TIME_AFTER_REQUEUE:-false}
      SLURM_ADVISOR_LOG_LINKS_ENABLED: ${SLURM_ADVISOR_LOG_LINKS_ENABLED:-false}
      SLURM_ADVISOR_LOG_LINKS_DESTINATION: ${SLURM_ADVISOR_LOG_LINKS_DESTINATION:-/log-links}
      SLURM_ADVISOR_LOG_LINKS_SOURCE_ROOTS_JSON: '${SLURM_ADVISOR_LOG_LINKS_SOURCE_ROOTS_JSON:-["/data"]}'
      SLURM_ADVISOR_LOG_LINKS_APPLICATION_PATTERNS_JSON: '${SLURM_ADVISOR_LOG_LINKS_APPLICATION_PATTERNS_JSON:-[]}'
      SLURM_ADVISOR_LOG_LINKS_SCAN_INTERVAL: ${SLURM_ADVISOR_LOG_LINKS_SCAN_INTERVAL:-1m}
      SLURM_ADVISOR_LOG_LINKS_CLEANUP_INTERVAL: ${SLURM_ADVISOR_LOG_LINKS_CLEANUP_INTERVAL:-1h}
      SLURM_ADVISOR_LOG_LINKS_RETENTION: ${SLURM_ADVISOR_LOG_LINKS_RETENTION:-24h}
      SLURM_ADVISOR_LOG_LINKS_SCAN_TIMEOUT: ${SLURM_ADVISOR_LOG_LINKS_SCAN_TIMEOUT:-5s}
    ports:
      - "127.0.0.1:${SLURM_ADVISOR_METRICS_PORT:-19090}:9090"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data:ro
      - slurm_loglinks:/log-links
      - var_log_slurm:/var/log/slurm
    depends_on:
      - mock-heimdall
      - slurmctld
      - c1
      - c2
      - c3

  controller-peer:
    profiles: ["environment-isolation"]
    image: slurm-advisor-controller-controller:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["slurm-advisor-controller"]
    hostname: controller-peer
    environment:
      HEIMDALL_ENDPOINT: mock-heimdall-peer:8080
      SLURM_ADVISOR_MODE: ${SLURM_ADVISOR_PEER_MODE:-observe}
      SLURM_ADVISOR_LOG_LEVEL: ${SLURM_ADVISOR_LOG_LEVEL:-info}
      SLURM_ADVISOR_METRICS_ENABLED: "false"
      SLURM_ADVISOR_POLL_INTERVAL: ${SLURM_ADVISOR_POLL_INTERVAL:-2s}
      SLURM_ADVISOR_LOG_METADATA_REFRESH_INTERVAL: ${SLURM_ADVISOR_LOG_METADATA_REFRESH_INTERVAL:-5m}
      SLURM_ADVISOR_LOG_METADATA_ENRICHMENT_TIMEOUT: ${SLURM_ADVISOR_LOG_METADATA_ENRICHMENT_TIMEOUT:-2s}
      SLURM_ADVISOR_JOB_UPSERT_WORKER_POOL_SIZE: ${SLURM_ADVISOR_JOB_UPSERT_WORKER_POOL_SIZE:-8}
      SLURM_ADVISOR_ACCOUNTING_WORKER_POOL_SIZE: ${SLURM_ADVISOR_ACCOUNTING_WORKER_POOL_SIZE:-8}
      SLURM_ADVISOR_ACCOUNTING_TIMEOUT: ${SLURM_ADVISOR_ACCOUNTING_TIMEOUT:-5m}
      SLURM_ADVISOR_ADVICE_LOOP_TIMEOUT: ${SLURM_ADVISOR_ADVICE_LOOP_TIMEOUT:-10s}
      SLURM_ADVISOR_ENVIRONMENT: ${SLURM_ADVISOR_PEER_ENVIRONMENT:-unspecified}
      SLURM_ADVISOR_ACKNOWLEDGE_SCHEDULER_ACTIONS: ${SLURM_ADVISOR_PEER_ACKNOWLEDGE_SCHEDULER_ACTIONS:-false}
      SLURM_ADVISOR_ENABLE_EAGER_REQUEUE: ${SLURM_ADVISOR_ENABLE_EAGER_REQUEUE:-false}
      SLURM_ADVISOR_UPDATE_ELIGIBLE_TIME_AFTER_REQUEUE: ${SLURM_ADVISOR_UPDATE_ELIGIBLE_TIME_AFTER_REQUEUE:-false}
      SLURM_ADVISOR_LOG_LINKS_ENABLED: "false"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data:ro
      - var_log_slurm:/var/log/slurm
    depends_on:
      - mock-heimdall-peer
      - slurmctld
      - c1
      - c2
      - c3

  watchdog:
    image: slurm-watchdog:${IMAGE_TAG:-dev}
    pull_policy: never
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["slurm-watchdog"]
    hostname: watchdog
    environment:
      SLURM_WATCHDOG_MODE: ${SLURM_WATCHDOG_MODE:-observe}
      SLURM_WATCHDOG_ACKNOWLEDGE_SCHEDULER_ACTIONS: ${SLURM_WATCHDOG_ACKNOWLEDGE_SCHEDULER_ACTIONS:-false}
      SLURM_WATCHDOG_JOB_DEFAULT_MODE: ${SLURM_WATCHDOG_JOB_DEFAULT_MODE:-observe}
      SLURM_WATCHDOG_JOB_ACTIONS_ACKNOWLEDGED: ${SLURM_WATCHDOG_JOB_ACTIONS_ACKNOWLEDGED:-false}
      SLURM_WATCHDOG_ENVIRONMENT_PATTERN: ${SLURM_WATCHDOG_ENVIRONMENT_PATTERN:-unspecified}
      SLURM_WATCHDOG_POLL_INTERVAL: ${SLURM_WATCHDOG_POLL_INTERVAL:-2s}
      SLURM_WATCHDOG_RELEASE_TIMEOUT: ${SLURM_WATCHDOG_RELEASE_TIMEOUT:-10m}
      SLURM_WATCHDOG_CLEANUP_GRACE_PERIOD: ${SLURM_WATCHDOG_CLEANUP_GRACE_PERIOD:-10m}
      SLURM_WATCHDOG_SLURM_EXEC_TIMEOUT: ${SLURM_WATCHDOG_SLURM_EXEC_TIMEOUT:-5s}
      SLURM_WATCHDOG_PARTITION_ALLOWLIST: ${SLURM_WATCHDOG_PARTITION_ALLOWLIST:-}
      SLURM_WATCHDOG_VERSIONED_SQUEUE_JSON: ${SLURM_WATCHDOG_VERSIONED_SQUEUE_JSON:-false}
      SLURM_WATCHDOG_LOG_LEVEL: ${SLURM_WATCHDOG_LOG_LEVEL:-info}
      SLURM_WATCHDOG_METRICS_ENABLED: ${SLURM_WATCHDOG_METRICS_ENABLED:-true}
      SLURM_WATCHDOG_METRICS_ADDR: ":9091"
    ports:
      - "127.0.0.1:${SLURM_WATCHDOG_METRICS_PORT:-19091}:9091"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    depends_on:
      - slurmctld

  watchdog-peer:
    profiles: ["environment-isolation"]
    image: slurm-watchdog:${IMAGE_TAG:-dev}
    pull_policy: never
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["slurm-watchdog"]
    hostname: watchdog-peer
    environment:
      SLURM_WATCHDOG_MODE: ${SLURM_WATCHDOG_PEER_MODE:-observe}
      SLURM_WATCHDOG_ACKNOWLEDGE_SCHEDULER_ACTIONS: ${SLURM_WATCHDOG_PEER_ACKNOWLEDGE_SCHEDULER_ACTIONS:-false}
      SLURM_WATCHDOG_JOB_DEFAULT_MODE: ${SLURM_WATCHDOG_JOB_DEFAULT_MODE:-observe}
      SLURM_WATCHDOG_JOB_ACTIONS_ACKNOWLEDGED: ${SLURM_WATCHDOG_JOB_ACTIONS_ACKNOWLEDGED:-false}
      SLURM_WATCHDOG_ENVIRONMENT_PATTERN: ${SLURM_WATCHDOG_PEER_ENVIRONMENT_PATTERN:-unspecified}
      SLURM_WATCHDOG_POLL_INTERVAL: ${SLURM_WATCHDOG_POLL_INTERVAL:-2s}
      SLURM_WATCHDOG_RELEASE_TIMEOUT: ${SLURM_WATCHDOG_RELEASE_TIMEOUT:-10m}
      SLURM_WATCHDOG_CLEANUP_GRACE_PERIOD: ${SLURM_WATCHDOG_CLEANUP_GRACE_PERIOD:-10m}
      SLURM_WATCHDOG_SLURM_EXEC_TIMEOUT: ${SLURM_WATCHDOG_SLURM_EXEC_TIMEOUT:-5s}
      SLURM_WATCHDOG_PARTITION_ALLOWLIST: ${SLURM_WATCHDOG_PARTITION_ALLOWLIST:-}
      SLURM_WATCHDOG_VERSIONED_SQUEUE_JSON: ${SLURM_WATCHDOG_VERSIONED_SQUEUE_JSON:-false}
      SLURM_WATCHDOG_LOG_LEVEL: ${SLURM_WATCHDOG_LOG_LEVEL:-info}
      SLURM_WATCHDOG_METRICS_ENABLED: "false"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    depends_on:
      - slurmctld

volumes:
  etc_munge:
  etc_slurm:
  slurm_jobdir:
  slurm_loglinks:
  var_lib_mysql:
  var_log_slurm:
