---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - heimdall.nvidia.com
  resources:
  - advices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - heimdall.nvidia.com
  resources:
  - advices/finalizers
  verbs:
  - update
- apiGroups:
  - heimdall.nvidia.com
  resources:
  - advices/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - run.ai
  resources:
  - distributedworkloads
  verbs:
  - get
