{{ if .Values.fluentbit.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "watcher.fullname" . }}-fluent-bit-config
  labels:
    {{- include "watcher.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name  dummy
        Dummy {"message": "dummy message generated by mmelo"}
        Interval_sec 10

    [OUTPUT]
        Name                 opentelemetry
        Match                *
        Host                 {{ .Values.fluentbit.otlpHost }}
        Port                 443
        Metrics_uri          /v1/metrics
        Logs_uri             /v1/logs
        Traces_uri           /v1/traces
        Log_response_payload True
        Tls                  On
        Tls.verify           Off
        logs_body_key $message
        logs_span_id_message_key span_id
        logs_trace_id_message_key trace_id
        logs_severity_text_message_key loglevel
        logs_severity_number_message_key lognum
        # add user-defined labels
        add_label            appname nvidia-recovery-watcher
        add_label            Authorization ${OTLP_AUTH_TOKEN}
{{- end -}}
