{{ if or .Values.grafana_dashboard.enabled ((.Values.global).grafana_dashboard).enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "job-manager.fullname" . }}-db-config
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "job-manager.labels" . | nindent 4 }}
  annotations:
    k8s-sidecar-target-directory: ./Heimdall
data:
  job-manager.json: |
{{ .Files.Get "files/grafana-db-job_manager.json" | indent 4 }}

{{- end }}
