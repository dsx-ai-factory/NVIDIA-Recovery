apiVersion: v1
kind: Service
metadata:
  name: {{ include "attribution-service.fullname" . }}
  labels:
    {{- include "attribution-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "attribution-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      protocol: TCP
      targetPort: http
