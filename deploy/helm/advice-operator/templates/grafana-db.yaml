{{- if or .Values.grafana_dashboard.enabled ((.Values.global).grafana_dashboard).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "advice-operator.fullname" . }}-db-config
  namespace: {{ template "advice-operator.namespace" . }}
  labels:
    grafana_dashboard: "1"
    {{- include "advice-operator.labels" . | nindent 4 }}
  annotations:
    k8s-sidecar-target-directory: ./Heimdall
data:
  advice-operator.json: |
{{ .Files.Get "files/grafana-db-advice-operator.json" | indent 4 }}
{{- end }}
