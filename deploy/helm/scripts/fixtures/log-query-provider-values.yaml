# Lint/render fixture for charts that require explicit log-query connections.
# The endpoint matches the auth-disabled Loki gateway in the local E2E stack.
global:
  log_query:
    backend: loki
    providers:
      loki:
        queries:
          attribution:
            application: '{{app="test", cluster="test-cluster"}} |= `{}`'
            system: '{app="test", cluster="test-cluster"}'
            epilogue: '{{app="test", cluster="test-cluster"}} |= `epilogue {}`'
        application:
          url: http://loki-gateway.monitoring.svc.cluster.local
          tenants: ""
          org_id: ""
        system:
          url: http://loki-gateway.monitoring.svc.cluster.local
          tenants: ""
          org_id: ""
