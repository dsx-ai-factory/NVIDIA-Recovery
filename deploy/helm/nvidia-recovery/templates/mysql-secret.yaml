{{ $password := .Values.global.mysql.secret.password -}}
{{- if not $password -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.global.mysql.secret.name -}}
  {{- if and $existing .Values.mysql.enabled -}}
    {{- $password = index $existing.data "mysql-root-password" | b64dec -}}
  {{- else if $existing -}}
    {{- $password = index $existing.data .Values.global.mysql.secret.key | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 20 -}}
  {{- end -}}
{{- end -}}

{{- if .Values.global.mysql.secret.create }}
apiVersion: v1
data:
{{- if .Values.mysql.enabled }}
  mysql-root-password: {{ $password | b64enc }}
  mysql-password: {{ $password | b64enc }}
{{- else }}
  {{ .Values.global.mysql.secret.key }}: {{ $password | b64enc }}
{{- end }}
kind: Secret
metadata:
  name: {{ .Values.global.mysql.secret.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
{{- end -}}
