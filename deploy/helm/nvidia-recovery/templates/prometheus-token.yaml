{{ if .Values.global.prometheus.create_token_secret }}
apiVersion: v1
data:
  token: "{{ .Values.global.prometheus.token | b64enc }}"
kind: Secret
metadata:
  name: heimdall-prometheus-token
  namespace: {{ .Release.Namespace }}
type: Opaque
{{ end }}
