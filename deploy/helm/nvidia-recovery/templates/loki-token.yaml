{{ if .Values.global.loki.create_token_secret }}
apiVersion: v1
data:
  token: "{{ .Values.global.loki.token | b64enc }}"
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: loki-token
{{ end }}
