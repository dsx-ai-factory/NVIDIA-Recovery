{{ if .Values.global.prometheus.pod_monitor_enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: heimdall-pod-monitor
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames:
    -  {{ .Release.Namespace }}
  podMetricsEndpoints:
  - targetPort: metrics
  - targetPort: 8080
  selector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: Exists
{{ end }}
