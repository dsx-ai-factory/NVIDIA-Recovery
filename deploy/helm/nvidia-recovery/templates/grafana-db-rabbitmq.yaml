{{ if or .Values.grafana_dashboard.enabled ((.Values.global).grafana_dashboard).enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-grafana-db-config-rabbitmq" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: ./Heimdall
data:
  rabbitmq.json: |
{{ .Files.Get "files/grafana-aps-db-rabbitmq.json" | indent 4 }}

{{- end }}
