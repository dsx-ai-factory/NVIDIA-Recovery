{{ if and .Values.global.registrySecret.create .Values.global.registrySecret.username .Values.global.registrySecret.password .Values.global.registrySecret.url (eq .Values.global.registrySecret.type "standard")}}
{{ $auth := print .Values.global.registrySecret.username ":" .Values.global.registrySecret.password }}
apiVersion: v1
data:
  .dockerconfigjson: {"auths":{"{{ .Values.global.registrySecret.url }}":{"username":"{{ .Values.global.registrySecret.username }}","password":"{{ .Values.global.registrySecret.password }}","auth":"{{ $auth|b64enc }}"}}}
kind: Secret
metadata:
  name: {{ .Values.global.registrySecret.name }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
{{ end }}
