{{ $password := .Values.global.rabbitmq.secret.password -}}
{{- $cookie := .Values.global.rabbitmq.secret.cookie -}}
{{- if not $password -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.global.rabbitmq.secret.name -}}
  {{- if $existing -}}
    {{- $password = index $existing.data .Values.global.rabbitmq.secret.password_key | b64dec -}}
    {{- $cookie = index $existing.data .Values.global.rabbitmq.secret.cookie_key | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 20 -}}
    {{- $cookie = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}

{{ if .Values.global.rabbitmq.secret.create }}
apiVersion: v1
data:
  {{ .Values.global.rabbitmq.secret.password_key }}: {{ $password | b64enc }}
  {{ .Values.global.rabbitmq.secret.cookie_key }}: {{ $cookie | b64enc }}
kind: Secret
metadata:
  name: {{ .Values.global.rabbitmq.secret.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
{{ end }}
