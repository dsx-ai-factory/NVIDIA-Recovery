{{ if .Values.dependency_checker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-checker-scripts
  namespace: {{ .Release.Namespace }}
data:
  {{- $root := . }}
  {{- range $path, $_ := .Files.Glob "files/checker-scripts/*" }}
  {{ base $path }}: |-
{{ $root.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
