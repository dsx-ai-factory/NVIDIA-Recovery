{{- if not .Values.auth.existingSessionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.sessionSecretName" . | quote }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "dashboard.sessionSecretData" . | nindent 2 }}
{{- end }}
