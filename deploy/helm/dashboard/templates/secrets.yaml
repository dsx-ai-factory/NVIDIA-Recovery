{{ if .Values.auth.azure.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.azure.azureAdSecretName }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  {{ .Values.auth.azure.azureAdClientIdKey }}: {{ .Values.auth.azure.azureAdClientIdValue | b64enc }}
  {{ .Values.auth.azure.azureAdClientSecretKey }}: {{ .Values.auth.azure.azureAdClientSecretValue | b64enc }}
  {{ .Values.auth.azure.azureAdTenantIdKey }}: {{ .Values.auth.azure.azureAdTenantIdValue | b64enc }}
type: Opaque
{{ end }}

---
{{ if .Values.auth.starfleet.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.starfleet.starfleetSecretName }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  {{ .Values.auth.starfleet.starfleetClientIdKey }}: {{ .Values.auth.starfleet.starfleetClientIdValue | b64enc }}
  {{ .Values.auth.starfleet.starfleetClientSecretKey }}: {{ .Values.auth.starfleet.starfleetClientSecretValue | b64enc }}
  {{ .Values.auth.starfleet.starfleetOpenIdConfigUrlKey }}: {{ .Values.auth.starfleet.starfleetOpenIdConfigUrlValue | b64enc }}
type: Opaque
{{ end }}

---
{{ if .Values.auth.ldap.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.ldap.ldapCASecretName }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  {{ .Values.auth.ldap.keyName }}: {{ .Values.auth.ldap.keyValue | b64enc }}
  {{ .Values.auth.ldap.certName }}: {{ .Values.auth.ldap.certValue | b64enc }}
  {{ .Values.auth.ldap.caName }}: {{ .Values.auth.ldap.caValue | b64enc }}
type: Opaque
{{ end }}
