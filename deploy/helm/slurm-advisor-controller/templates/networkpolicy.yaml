{{ if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slurm-advisor-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-advisor-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slurm-advisor-controller.commonSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
