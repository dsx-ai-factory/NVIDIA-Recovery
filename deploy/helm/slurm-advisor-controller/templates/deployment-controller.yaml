{{ include "slurm-advisor-controller.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slurm-advisor-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-advisor-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "slurm-advisor-controller.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slurm-advisor-controller.controllerSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "slurm-advisor-controller.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsConfig:
        searches:
          - {{ printf "%s.%s.svc.cluster.local" (first (splitList ":" .Values.sackd.confServer)) .Release.Namespace | quote }}
      initContainers:
        {{- include "slurm-advisor-controller.slurmInitContainer" . | nindent 8 }}
      containers:
        - name: slurm-advisor-controller
          image: {{ include "slurm-advisor-controller.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HEIMDALL_ENDPOINT
              value: {{ .Values.controller.heimdallEndpoint | quote }}
            - name: SLURM_ADVISOR_TLS_ENABLED
              value: {{ .Values.controller.gatewayTLS.enabled | quote }}
            {{- if .Values.controller.gatewayTLS.enabled }}
            - name: SLURM_ADVISOR_TLS_SERVER_NAME
              value: {{ .Values.controller.gatewayTLS.serverName | quote }}
            {{- if .Values.controller.gatewayTLS.caConfigMap.name }}
            - name: SLURM_ADVISOR_TLS_CA_FILE
              value: /var/run/config/heimdall-tls/ca.crt
            {{- end }}
            {{- end }}
            - name: SLURM_ADVISOR_MODE
              value: {{ .Values.controller.mode | quote }}
            - name: SLURM_ADVISOR_LOG_LEVEL
              value: {{ .Values.controller.logLevel | quote }}
            - name: SLURM_ADVISOR_POLL_INTERVAL
              value: {{ .Values.controller.pollInterval | quote }}
            - name: SLURM_EXEC_TIMEOUT
              value: {{ .Values.controller.slurmExecTimeout | quote }}
            - name: SLURM_ADVISOR_LOG_METADATA_REFRESH_INTERVAL
              value: {{ .Values.controller.logMetadataRefreshInterval | quote }}
            - name: SLURM_ADVISOR_LOG_METADATA_ENRICHMENT_TIMEOUT
              value: {{ .Values.controller.logMetadataEnrichmentTimeout | quote }}
            - name: SLURM_ADVISOR_JOB_UPSERT_WORKER_POOL_SIZE
              value: {{ .Values.controller.jobUpsertWorkerPoolSize | quote }}
            - name: SLURM_ADVISOR_ACCOUNTING_WORKER_POOL_SIZE
              value: {{ .Values.controller.accountingWorkerPoolSize | quote }}
            - name: SLURM_ADVISOR_ACCOUNTING_TIMEOUT
              value: {{ .Values.controller.accountingTimeout | quote }}
            - name: SLURM_ADVISOR_FAILED_JOB_RECOVERY_TIMEOUT
              value: {{ .Values.controller.failedJobRecoveryTimeout | quote }}
            - name: SLURM_ADVISOR_ADVICE_LOOP_TIMEOUT
              value: {{ .Values.controller.adviceLoopTimeout | quote }}
            - name: SLURM_ADVISOR_ADVICE_ITEM_TIMEOUT
              value: {{ .Values.controller.adviceItemTimeout | quote }}
            - name: SLURM_ADVISOR_ADVICE_MAX_AGE
              value: {{ .Values.controller.adviceMaxAge | quote }}
            - name: SLURM_ADVISOR_ENABLE_EAGER_REQUEUE
              value: {{ .Values.controller.enableEagerRequeue | quote }}
            - name: SLURM_ADVISOR_BOOTSTRAP_FAILURE_LOOKBACK
              value: {{ .Values.controller.bootstrapFailureLookback | quote }}
            - name: SLURM_ADVISOR_REQUEUE_HOLD_DELAY
              value: {{ .Values.controller.requeueHoldDelay | quote }}
            - name: SLURM_ADVISOR_ENVIRONMENT
              value: {{ .Values.controller.environment | quote }}
            - name: SLURM_ADVISOR_USER_ALLOWLIST
              value: {{ join "," .Values.controller.userAllowlist | quote }}
            - name: SLURM_ADVISOR_PARTITION_ALLOWLIST
              value: {{ join "," .Values.controller.partitionAllowlist | quote }}
            - name: SLURM_ADVISOR_VERSIONED_SQUEUE_JSON
              value: {{ .Values.controller.versionedSqueueJSON | quote }}
            - name: SLURM_ADVISOR_UPDATE_ELIGIBLE_TIME_AFTER_REQUEUE
              value: {{ .Values.controller.updateEligibleTimeAfterRequeue | quote }}
            - name: SLURM_ADVISOR_ACKNOWLEDGE_SCHEDULER_ACTIONS
              value: {{ .Values.controller.acknowledgeSchedulerActions | quote }}
            - name: SLURM_ADVISOR_AUDIT_TRAIL_DESTINATION
              value: {{ .Values.controller.auditTrail.destination | quote }}
            - name: SLURM_ADVISOR_AUDIT_TRAIL_MAX_BATCH_SIZE
              value: {{ .Values.controller.auditTrail.maxBatchSize | quote }}
            - name: SLURM_ADVISOR_AUDIT_TRAIL_BUFFER_SIZE
              value: {{ .Values.controller.auditTrail.bufferSize | quote }}
            - name: SLURM_ADVISOR_AUDIT_TRAIL_FLUSH_INTERVAL
              value: {{ .Values.controller.auditTrail.flushInterval | quote }}
            - name: SLURM_ADVISOR_MILESTONE_QUEUE_CAPACITY
              value: {{ .Values.controller.milestoneReporting.queueCapacity | quote }}
            - name: SLURM_ADVISOR_MILESTONE_RPC_TIMEOUT
              value: {{ .Values.controller.milestoneReporting.rpcTimeout | quote }}
            - name: SLURM_ADVISOR_MILESTONE_MAX_ATTEMPTS
              value: {{ .Values.controller.milestoneReporting.maxAttempts | quote }}
            - name: SLURM_ADVISOR_MILESTONE_RETRY_DELAY
              value: {{ .Values.controller.milestoneReporting.retryDelay | quote }}
            - name: SLURM_ADVISOR_MILESTONE_SHUTDOWN_TIMEOUT
              value: {{ .Values.controller.milestoneReporting.shutdownTimeout | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_ENABLED
              value: {{ .Values.controller.logLinks.enabled | quote }}
            {{- if .Values.controller.logLinks.enabled }}
            - name: SLURM_ADVISOR_LOG_LINKS_DESTINATION
              value: {{ .Values.controller.logLinks.destination.mountPath | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_SOURCE_ROOTS_JSON
              value: {{ include "slurm-advisor-controller.logLinkSourceRootsJSON" . | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_APPLICATION_PATTERNS_JSON
              value: {{ mustToJson .Values.controller.logLinks.applicationPatterns | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_SCAN_INTERVAL
              value: {{ .Values.controller.logLinks.scanInterval | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_CLEANUP_INTERVAL
              value: {{ .Values.controller.logLinks.cleanupInterval | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_RETENTION
              value: {{ .Values.controller.logLinks.retention | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_SCAN_TIMEOUT
              value: {{ .Values.controller.logLinks.scanTimeout | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_PATH_LENGTH
              value: {{ .Values.controller.logLinks.maxPathLength | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_PATHS_PER_SYNC
              value: {{ .Values.controller.logLinks.maxPathsPerSync | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_PATTERNS
              value: {{ .Values.controller.logLinks.maxPatterns | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_SCAN_DIRECTORIES
              value: {{ .Values.controller.logLinks.maxScanDirectories | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_ENTRIES_PER_DIRECTORY
              value: {{ .Values.controller.logLinks.maxEntriesPerDirectory | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_MATCHES_PER_SCAN
              value: {{ .Values.controller.logLinks.maxMatchesPerScan | quote }}
            - name: SLURM_ADVISOR_LOG_LINKS_MAX_OWNED_LINKS
              value: {{ .Values.controller.logLinks.maxOwnedLinks | quote }}
            {{- end }}
            {{- if .Values.controller.kubernetesAuth.enabled }}
            - name: SLURM_ADVISOR_SERVICE_ACCOUNT_TOKEN_PATH
              value: "/var/run/secrets/heimdall/service-account-token"
            {{- end }}
            - name: SLURM_ADVISOR_METRICS_ENABLED
              value: {{ .Values.metrics.controller.enabled | quote }}
            - name: SLURM_ADVISOR_METRICS_ADDR
              value: {{ printf "%s:%v" .Values.metrics.controller.bindAddress .Values.metrics.controller.port | quote }}
            {{- if (((.Values.global).otelcollector).enabled) }}
            {{- include "slurm-advisor-controller.otelEnv" . | nindent 12 }}
            {{- end }}
          {{- if .Values.metrics.controller.enabled }}
          ports:
            - name: ctrl-metrics
              containerPort: {{ .Values.metrics.controller.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: ctrl-metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.controller.gatewayTLS.caConfigMap.name }}
            - name: heimdall-tls-ca
              mountPath: /var/run/config/heimdall-tls
              readOnly: true
            {{- end }}
            - name: slurm-config
              mountPath: /etc/slurm
              readOnly: true
            - name: slurm-runtime
              mountPath: /run/slurm
            {{- if .Values.controller.kubernetesAuth.enabled }}
            - name: heimdall-service-account-token
              mountPath: /var/run/secrets/heimdall
              readOnly: true
            {{- end }}
            {{- if .Values.controller.logLinks.enabled }}
            - name: log-links-destination
              mountPath: {{ .Values.controller.logLinks.destination.mountPath | quote }}
              readOnly: false
            {{- range $index, $source := .Values.controller.logLinks.sources }}
            - name: {{ printf "log-links-source-%d" $index }}
              mountPath: {{ $source.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
        {{- include "slurm-advisor-controller.sackdContainer" . | nindent 8 }}
      volumes:
        {{- if .Values.controller.gatewayTLS.caConfigMap.name }}
        - name: heimdall-tls-ca
          configMap:
            name: {{ .Values.controller.gatewayTLS.caConfigMap.name | quote }}
            items:
              - key: {{ .Values.controller.gatewayTLS.caConfigMap.key | quote }}
                path: ca.crt
        {{- end }}
        {{- include "slurm-advisor-controller.slurmVolumes" . | nindent 8 }}
        {{- if .Values.controller.kubernetesAuth.enabled }}
        - name: heimdall-service-account-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.controller.kubernetesAuth.audience | quote }}
                  expirationSeconds: {{ .Values.controller.kubernetesAuth.expirationSeconds }}
                  path: service-account-token
        {{- end }}
        {{- if .Values.controller.logLinks.enabled }}
        - name: log-links-destination
        {{- if hasKey .Values.controller.logLinks.destination "claimName" }}
          persistentVolumeClaim:
            claimName: {{ .Values.controller.logLinks.destination.claimName | quote }}
        {{- else }}
          hostPath:
            path: {{ .Values.controller.logLinks.destination.hostPath | quote }}
            type: Directory
        {{- end }}
        {{- range $index, $source := .Values.controller.logLinks.sources }}
        - name: {{ printf "log-links-source-%d" $index }}
        {{- if hasKey $source "claimName" }}
          persistentVolumeClaim:
            claimName: {{ $source.claimName | quote }}
            readOnly: true
        {{- else }}
          hostPath:
            path: {{ $source.hostPath | quote }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
