credentials:
  rabbitmq:
    secret_name: null
    secret_key_name: rabbitmq-password

event_bus:
  attribution_request_exchange: attribution_request_exchange
  attribution_request_queue: job_updates_attribution_request
  isolator_completed_exchange: aie_eventbus_exchange
  slow_signals_exchange: aie_eventbus_exchange
  slow_signals_queue: slow_signals_queue
  exchange: "test_exchange"
  host: nvidia-recovery-rabbitmq
  username: rabbitmq
  port: 5672
  vhost: default-vhost
  queue_name: HANG-QUEUE
  routing_key: "wart.hkey"
root_path: "/wadi"
num_worker_threads: 20
epilogue_started_wait_seconds: 0
slow_signals_enabled: true
slow_signals_delay_seconds: 600
epilog_query_duration_minutes: 3
max_isolated_nodes: 3
# Rack-aware isolation feature flag (default: false, uses per-cluster limits)
# Set to true to enable per-rack isolation limits
rack_aware_isolation_enabled: false
# Per-rack isolation limits (only applies when rack_aware_isolation_enabled=true)
max_isolated_nodes_per_rack: 2
# Maximum number of racks that can have isolated nodes simultaneously (default: 9)
# If exceeded, prioritizes racks with more confirmed nodes
max_racks_to_isolate: 9
# Custom rack extraction pattern (optional, uses default patterns if not set)
# Default pattern supports: nvl72[dD]010-T12 -> "nvl72010"
# rack_extraction_pattern: "nvl72[dD]?(\\d+)-T\\d+"
# HTTP request timeouts (seconds) for downstream service calls.
# These prevent indefinite hangs on unresponsive services.
jobmanager_http_timeout_seconds: 30
job_manager:
  host: http://job-manager
  port: 8080
  status_path: "/job_status/"
grafana_dashboard:
  enabled: false

imagePullSecrets: []

nodeSelector: {}

tolerations: []

volumes: []

volumeMounts: []

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  automount: true
  # Annotations to add to the service account
  annotations: {}
  name: ""

# Look at the README.md at ./deploy/helm/README.md
enableExtendedLabelSelectors: false
