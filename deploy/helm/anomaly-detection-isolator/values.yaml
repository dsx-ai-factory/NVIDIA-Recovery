global: {}
port: 8080
resources:
  limits:
    memory: 10Gi
  requests:
    memory: 10Gi
replicas: 1
image:
  repository: ""
  name: anomaly-detection-isolator
  tag: ""
  pullPolicy: IfNotPresent
service_type: ClusterIP
command: ["anomaly-detection-isolator"]
attribution_engines: "FACT"

# Attribution adapter — the Policy Engine calls it over HTTP; it fronts the attribution engine (FACT).
# Omit attribution_service_url to use the same-release adapter on port 8000.
# Set it explicitly for an external adapter or a custom Service name/port.
attribution_enabled: true
attribution_fast_http_timeout_seconds: 90
attribution_slow_http_timeout_seconds: 180

audit_trail:
  # Omit destination to use the same-release Notifications Service on port 8080.
  # Set a URL for a custom Service/receiver, or ""/null for logging only.
  max_batch_size: 100
  max_buffer_size: 1000
  flush_interval_seconds: 30

