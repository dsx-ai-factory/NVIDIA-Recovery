apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.52.0
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod=1d
            - -httpListenAddr=:9428
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: http
