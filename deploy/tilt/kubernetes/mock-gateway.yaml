apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-advice-gateway
  namespace: recovery-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-advice-gateway
  template:
    metadata:
      labels:
        app: mock-advice-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: mock-advice-gateway:dev
          ports:
            - name: grpc
              containerPort: 8080
            - name: fixture
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: fixture
          livenessProbe:
            httpGet:
              path: /healthz
              port: fixture
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-advice-gateway
  namespace: recovery-dev
spec:
  selector:
    app: mock-advice-gateway
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: fixture
      port: 8081
      targetPort: fixture
