apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: advice-operator-dev-jobset-owner
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: advice-operator-dev-jobset-owner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: advice-operator-dev-jobset-owner
subjects:
  - kind: ServiceAccount
    name: advice-operator
    namespace: recovery-dev
