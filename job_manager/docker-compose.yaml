services:
  rabbitmq:
    image: rabbitmq:management
    # network_mode: host
    hostname: localhost
    expose:
      - 5672
      - 15672
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  db:
    image: mysql:9.0.1
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root
      MYSQL_DATABASE: aps_workflow_db
      MYSQL_USER: aps_test
      MYSQL_PASSWORD: aps_test
    expose:
      - 3306
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
