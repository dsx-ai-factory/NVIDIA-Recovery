[project]
name = "job-manager"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.125.0",
    "python-etcd>=0.4.5",
    "httpx>=0.28.1",
    "uvicorn>=0.31.1",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "requests>=2.34.2",
    "uuid6>=2024.1.12",
    "recovery-libs",
    "pydantic-settings>=2.7.1",
    "kubernetes>=30.0.0",
    "fastapi-mcp>=0.4.0",
    "mcp>=1.28.1,<2",
    "starlette>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest-cov",
    "pytest",
    "pytest-mock",
    "types-python-dateutil>=2.9.0.20241206",
    "types-pyyaml>=6.0.12.20241230",
    "types-requests",
    "pytest-subtests>=0.14.2",
    "mypy",
]

[project.scripts]
job-manager = "job_manager.main:main"
job-manager-dump-schema = "job_manager.main:dump_schema"

[tool.uv.sources]
recovery-libs = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "nightly: tests excluded from pull requests and main pushes; included in nightly and tagged-release suites",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
