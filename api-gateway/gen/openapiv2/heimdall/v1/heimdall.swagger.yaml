        description: List of nodes to explicitly include for job scheduling.
    description: NodeConstraints defines node scheduling constraints for jobs.
  v1ProducerAuditEvent:
    type: object
    properties:
      heimdallJobId:
        type: string
        description: NVIDIA Recovery's internal identifier for the job.
      eventProducer:
        type: string
        description: Component that produced the event.
      eventType:
        type: string
        description: Stable event-type identifier.
      eventLevel:
        type: string
        description: Stable audit event-level identifier.
      payload:
        type: object
        description: Event-specific structured data.
      eventProducedAt:
        type: string
        format: int64
        description: Producer emission time as Unix microseconds.
      idempotencyKey:
        type: string
        description: Producer-computed key used to discard duplicate events.
    description: ProducerAuditEvent is one structured event emitted by an NVIDIA Recovery component.
  v1RecordRecoveryMilestoneRequest:
    type: object
    properties:
      sequenceId:
        type: string
        description: Durable recovery sequence UUID.
      idempotencyKey:
        type: string
        description: Stable key that deduplicates reports of this action occurrence.
      operation:
        $ref: '#/definitions/v1RecoveryOperation'
        description: Scheduler-neutral recovery operation.
      action:
        $ref: '#/definitions/v1RecoverySchedulerAction'
        description: Scheduler action that was attempted or evaluated.
      outcome:
        $ref: '#/definitions/v1RecoverySchedulerActionOutcome'
        description: Logical outcome of the action occurrence.
      completedAt:
        type: string
        format: date-time
        description: When the scheduler action returned or its logical outcome was determined.
      completesSequence:
        type: boolean
        description: |-
          Whether this occurrence completes the owning recovery sequence.
          The scheduler adapter sets this from its workflow semantics; Job Manager
          does not derive it from operation, action, or outcome.
    description: RecordRecoveryMilestoneRequest records one scheduler-action completion occurrence.
    required:
      - sequenceId
      - idempotencyKey
      - operation
      - action
      - outcome
      - completedAt
      - completesSequence
  v1RecordRecoveryMilestoneResponse:
    type: object
    properties:
      duplicate:
        type: boolean
        description: Whether this idempotency key had already been recorded.
      sequenceCompleted:
        type: boolean
        description: Whether the sequence is completed after accepting this report.
      endToEndDurationSeconds:
        type: number
        format: double
        description: Trigger-to-terminal-milestone duration when this report newly completed its sequence.
    description: RecordRecoveryMilestoneResponse reports durable milestone acceptance.
  v1RecoveryContext:
    type: object
    properties:
      sequenceId:
        type: string
        description: The durable recovery sequence UUID assigned by Job Manager.
      traceparent:
        type: string
        description: The canonical W3C traceparent for later recovery work.
      tracestate:
        type: string
        description: The canonical W3C tracestate, when present.
      triggeredAt:
        type: string
        format: date-time
        description: When the triggering condition was observed.
      operation:
        $ref: '#/definitions/v1RecoveryOperation'
        description: The scheduler-neutral recovery operation.
    description: |-
      RecoveryContext carries one durable recovery sequence's W3C trace context.
      It is correlation data and does not authorize or otherwise change scheduler actions.
    required:
      - sequenceId
      - traceparent
      - triggeredAt
      - operation
  v1RecoveryOperation:
    type: string
    enum:
      - RECOVERY_OPERATION_UNSPECIFIED
      - RECOVERY_OPERATION_RESTART
      - RECOVERY_OPERATION_TERMINATE
      - RECOVERY_OPERATION_DAG_RELEASE
    default: RECOVERY_OPERATION_UNSPECIFIED
    description: |-
      RecoveryOperation identifies the scheduler-neutral recovery intent.

       - RECOVERY_OPERATION_UNSPECIFIED: No recovery operation was specified.
       - RECOVERY_OPERATION_RESTART: Restart the failed source attempt.
       - RECOVERY_OPERATION_TERMINATE: Terminate the source attempt.
       - RECOVERY_OPERATION_DAG_RELEASE: Release a held job after its DAG dependencies are satisfied.
  v1RecoverySchedulerAction:
    type: string
    enum:
      - RECOVERY_SCHEDULER_ACTION_UNSPECIFIED
      - RECOVERY_SCHEDULER_ACTION_SLURM_REQUEUE_HOLD
      - RECOVERY_SCHEDULER_ACTION_SLURM_UPDATE_CONSTRAINTS
      - RECOVERY_SCHEDULER_ACTION_SLURM_RELEASE
      - RECOVERY_SCHEDULER_ACTION_SLURM_CANCEL
    default: RECOVERY_SCHEDULER_ACTION_UNSPECIFIED
    description: |-
      RecoverySchedulerAction identifies one scheduler command occurrence.

       - RECOVERY_SCHEDULER_ACTION_UNSPECIFIED: No scheduler action was specified.
       - RECOVERY_SCHEDULER_ACTION_SLURM_REQUEUE_HOLD: Ask Slurm to requeue the job and hold the target attempt.
       - RECOVERY_SCHEDULER_ACTION_SLURM_UPDATE_CONSTRAINTS: Ask Slurm to update the target attempt's node constraints.
       - RECOVERY_SCHEDULER_ACTION_SLURM_RELEASE: Ask Slurm to release the target attempt from its hold.
       - RECOVERY_SCHEDULER_ACTION_SLURM_CANCEL: Ask Slurm to cancel the job.
  v1RecoverySchedulerActionOutcome:
    type: string
    enum:
      - RECOVERY_SCHEDULER_ACTION_OUTCOME_UNSPECIFIED
      - RECOVERY_SCHEDULER_ACTION_OUTCOME_PLANNED
      - RECOVERY_SCHEDULER_ACTION_OUTCOME_SUCCESS
      - RECOVERY_SCHEDULER_ACTION_OUTCOME_ERROR
      - RECOVERY_SCHEDULER_ACTION_OUTCOME_ALREADY_SATISFIED
    default: RECOVERY_SCHEDULER_ACTION_OUTCOME_UNSPECIFIED
    description: |-
      RecoverySchedulerActionOutcome classifies one scheduler action occurrence.

       - RECOVERY_SCHEDULER_ACTION_OUTCOME_UNSPECIFIED: No scheduler action outcome was specified.
       - RECOVERY_SCHEDULER_ACTION_OUTCOME_PLANNED: The action was planned in observe mode and no command ran.
       - RECOVERY_SCHEDULER_ACTION_OUTCOME_SUCCESS: The scheduler command completed successfully.
       - RECOVERY_SCHEDULER_ACTION_OUTCOME_ERROR: The scheduler command returned an error.
       - RECOVERY_SCHEDULER_ACTION_OUTCOME_ALREADY_SATISFIED: Fresh scheduler state showed that the action was already satisfied.
  v1RemediationAction:
    type: object
    properties:
      actionType:
        type: string
        description: The type of action (e.g., "exclude_node", "restart_job").
      timestamp:
        type: string
        format: date-time
        description: When the action was taken.
      reason:
        type: string
        description: The reason for taking this action.
      resourceDetails:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ResourceDetail'
        description: Resources affected by this action.
    description: RemediationAction represents an action taken to remediate an issue.
  v1ResourceDetail:
    type: object
    properties:
      resourceType:
        type: string
        description: The type of resource (e.g., "node", "gpu").
      resourceId:
        type: string
        description: The unique identifier of the resource.
      details:
        type: string
        description: Additional details about the resource.
    description: ResourceDetail represents details about a specific resource.
  v1RetrieveApiKeyResponse:
    type: object
    properties:
      key:
        $ref: '#/definitions/v1ApiKey'
  v1UpdateAdviceReconciliationStatusResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/v1AdviceReconciliationStatus'
        description: Idempotently persisted reconciliation status.
    description: UpdateAdviceReconciliationStatusResponse returns the persisted status.
  v1UpdateApiKeyAuthorizationsResponse:
    type: object
    properties:
      key:
        $ref: '#/definitions/v1ApiKey'
        description: Legacy response field. Disabled endpoints always return an error instead.
  v1Workflow:
    type: object
    properties:
      workflowId:
        type: string
        maxLength: 256
        minLength: 1
      schedulerWorkflowId:
        type: string
        description: The ID of the workflow.
      name:
        type: string
        description: The name of the workflow.
      startTime:
        type: string
        format: date-time
        description: The start time of the workflow as utc unix timestamp.
      endTime:
        type: string
        format: date-time
        description: The end time of the workflow as utc unix timestamp.
    description: Workflow is the workflow.
    required:
      - workflowId
