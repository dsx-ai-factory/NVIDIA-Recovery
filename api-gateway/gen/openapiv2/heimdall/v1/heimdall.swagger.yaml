  v1JobRecoveryConfig:
    type: object
    properties:
      autoResumeMode:
        $ref: '#/definitions/JobRecoveryConfigAutoResumeMode'
        description: Job-level auto-resume mode.
      maxRequeueTimes:
        type: integer
        format: int32
        description: Maximum number of times a job can be requeued. Must be positive when present.
      requeueOnCompletion:
        type: boolean
        description: Whether normal completion should trigger requeue. Presence overrides the system default.
      anomalyDetectionConfig:
        $ref: '#/definitions/v1JobAnomalyDetectionConfig'
        description: Job-level anomaly detection policy supplied by the scheduler adapter.
      dagDependencies:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1JobDagDependency'
        description: Parent gates that must be satisfied before this job becomes eligible.
      dagAction:
        $ref: '#/definitions/JobRecoveryConfigDagAction'
        description: Action to apply after all DAG dependencies are satisfied.
      environment:
        type: string
        description: Optional APS routing environment preserved exactly from the scheduler job.
      logFilePathsSharedAcrossAttempts:
        type: boolean
        description: Whether requeued attempts intentionally write to the same log files.
    description: JobRecoveryConfig contains typed recovery policy for scheduler jobs.
  v1JobStatus:
    type: string
    enum:
      - JOB_STATUS_UNSPECIFIED
      - JOB_STATUS_PENDING
      - JOB_STATUS_RUNNING
      - JOB_STATUS_STOPPED
      - JOB_STATUS_COMPLETED
      - JOB_STATUS_FAILED
      - JOB_STATUS_CANCELLED
      - JOB_STATUS_DELETED
    default: JOB_STATUS_UNSPECIFIED
    description: |-
      JobStatus represents the state of a job.

       - JOB_STATUS_UNSPECIFIED: The status is not specified.
       - JOB_STATUS_PENDING: The job has been created but is not started yet due to being queued, waiting for resources or
      is pulling container images etc...
       - JOB_STATUS_RUNNING: The job is scheduled and has started running.
       - JOB_STATUS_STOPPED: A stopped job is no longer running or using resources.
       - JOB_STATUS_COMPLETED: The job completed without reporting an error.
       - JOB_STATUS_FAILED: The job exited with an error status.
       - JOB_STATUS_CANCELLED: Job was cancelled by the user or system.
       - JOB_STATUS_DELETED: The job is deleted.
  v1ListAdviceResponse:
