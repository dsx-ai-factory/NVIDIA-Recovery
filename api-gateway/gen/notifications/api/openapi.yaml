openapi: 3.1.0
info:
  description: NVIDIA Recovery Notifications
  title: Notifications
  version: 1.0.0
servers:
- url: /
paths:
  /metrics:
    get:
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /notification:
    post:
      operationId: notificationCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create a new notification
      tags:
      - notifications
  /notifications:
    get:
      operationId: notificationsGet
      parameters:
      - description: The id of the notification.
        explode: true
        in: query
        name: id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The recipient the notifications were sent to.
        explode: true
        in: query
        name: recipient
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The job_id associated with the job.
        explode: true
        in: query
        name: job_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The maximum number of records to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: The maximum number of records to return.
          title: Limit
          type: integer
        style: form
      - description: The offset to start the records from.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: The offset to start the records from.
          title: Offset
          type: integer
        style: form
      - description: Only show notifications created after this time.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Only show notifications created before this time.
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Items_NotificationPublic_"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get notifications
      tags:
      - notifications
  /user-preferences/{username}:
    get:
      operationId: userPreferencesGet
      parameters:
      - explode: false
        in: path
        name: username
        required: true
        schema:
          title: Username
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Retrieve a user's notification preferences.
      tags:
      - preferences
    put:
      operationId: userPreferencesPut
      parameters:
      - explode: false
        in: path
        name: username
        required: true
        schema:
          title: Username
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPut"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesPublic"
          description: Successful Response
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesPublic"
          description: Successfully created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create or update a user's notification preferences.
      tags:
      - preferences
  /v1/audit/events:
    get:
      operationId: auditEventsGet
      parameters:
      - description: Audit event level to match exactly.
        explode: true
        in: query
        name: event_level
        required: false
        schema:
          $ref: "#/components/schemas/AuditEventLevel"
        style: form
      - description: Producer service to match.
        explode: true
        in: query
        name: event_producer
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Event type to match exactly.
        explode: true
        in: query
        name: event_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Minimum Unix-microsecond event timestamp, inclusive."
        explode: true
        in: query
        name: min_event_produced_at
        required: false
        schema:
          format: int64
          nullable: true
          type: integer
        style: form
      - description: "Maximum Unix-microsecond event timestamp, inclusive."
        explode: true
        in: query
        name: max_event_produced_at
        required: false
        schema:
          format: int64
          nullable: true
          type: integer
        style: form
      - description: Maximum number of events to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of events to return.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: "Producer time order: asc or desc."
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: event_produced_at:desc
          description: "Producer time order: asc or desc."
          title: Sort By
          type: string
        style: form
      - description: Opaque cursor returned for an adjacent page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: NVIDIA Recovery job ID; exclusive with job_id.
        explode: true
        in: query
        name: heimdall_job_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Scheduler job ID; omit attempt_index for all attempts.
        explode: true
        in: query
        name: job_id
        required: false
        schema:
          minLength: 1
          nullable: true
          pattern: \S
          type: string
        style: form
      - description: Scheduler job attempt; requires job_id.
        explode: true
        in: query
        name: attempt_index
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Query audit events
      tags:
      - audit
    post:
      operationId: auditEventsCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerAuditEventBatch"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventIngestionResponse"
          description: The batch acceptance result.
        "413":
          description: The batch contains too many events.
        "429":
          description: The overloaded audit event store rejected the batch.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Ingest a batch of audit events
      tags:
      - audit
components:
  schemas:
    AnomalyAttributionResult:
      description: |-
        Anomaly attribution result for job attempt.

        Examples:
            If `summary` and `insight` are provided, skip the detailed error attribution:

                >>> message = AnomalyAttributionResult(
                ...     job_id="12345",
                ...     job_attempt_index=0,
                ...     summary="A summary from job manager.",
                ...     insight="Some insights from job manager.",
                ...     anomaly_type="CRASH",
                ...     error_attributions=[
                ...         ErrorAttribution(
                ...             job_execution_error=JobExecutionError(
                ...                 error_message="random error message",
                ...                 error_signature="random error signature",
                ...             ),
                ...             node_events=[
                ...                 NodeEvent(
                ...                     node="node_0",
                ...                     exclusion_type="temporary",
                ...                     error_attribution="system",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...                 NodeEvent(
                ...                     node="node_1",
                ...                     exclusion_type="confirmed",
                ...                     error_attribution="hardware",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...             ],
                ...         ),
                ...     ],
                ...     user="some-user",
                ... )
                >>> expected_message = '''\
                ... Attribution for the anomaly of type 'CRASH' for job 12345(0).
                ...
                ... Summary:
                ...   A summary from job manager.
                ...
                ... Insight:
                ...   Some insights from job manager.
                ... '''
                >>> assert_equal(message.render_message(), expected_message)

            If `summary` and `insight` are omitted, should display all the attribution info:

                >>> message = AnomalyAttributionResult(
                ...     job_id="12345",
                ...     job_attempt_index=0,
                ...     anomaly_type="CRASH",
                ...     error_attributions=[
                ...         ErrorAttribution(
                ...             job_execution_error=JobExecutionError(
                ...                 error_message="random error message",
                ...                 error_signature="random error signature",
                ...             ),
                ...             node_events=[
                ...                 NodeEvent(
                ...                     node="node_0",
                ...                     exclusion_type="temporary",
                ...                     error_attribution="system",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...                 NodeEvent(
                ...                     node="node_1",
                ...                     exclusion_type="confirmed",
                ...                     error_attribution="hardware",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...             ],
                ...         ),
                ...     ],
                ...     user="some-user",
                ... )
                >>> expected_message = '''\
                ... Attribution for the anomaly of type 'CRASH' for job 12345(0).
                ...
                ... Job execution error:
                ...   Error message: random error message
                ...   Error signature: random error signature
                ...
                ... Node attributions:
                ...   node_0:
                ...     exclusion type 'temporary'
                ...     error attribution 'system'
                ...     error attribution sources: ['APPLICATION_LOG', 'SYSLOG']
                ...   node_1:
                ...     exclusion type 'confirmed'
                ...     error attribution 'hardware'
                ...     error attribution sources: ['APPLICATION_LOG', 'SYSLOG']
                ... '''
                >>> assert_equal(message.render_message(), expected_message)

            The `error_message` can be `None`:

                >>> message_with_none = AnomalyAttributionResult(
                ...     job_id="12345",
                ...     job_attempt_index=0,
                ...     anomaly_type="CRASH",
                ...     error_attributions=[
                ...         ErrorAttribution(
                ...             job_execution_error=JobExecutionError(
                ...                 error_message=None,
                ...                 error_signature="random error signature",
                ...             ),
                ...             node_events=[
                ...                 NodeEvent(
                ...                     node="node_0",
                ...                     exclusion_type="temporary",
                ...                     error_attribution="system",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...                 NodeEvent(
                ...                     node="node_1",
                ...                     exclusion_type="confirmed",
                ...                     error_attribution="hardware",
                ...                     error_attribution_sources=["APPLICATION_LOG", "SYSLOG"]
                ...                 ),
                ...             ],
                ...         ),
                ...     ],
                ...     user="some-user",
                ... )
                >>> expected_message_with_none = '''\
                ... Attribution for the anomaly of type 'CRASH' for job 12345(0).
                ...
                ... Job execution error:
                ...   Error message:
                ...   Error signature: random error signature
                ...
                ... Node attributions:
                ...   node_0:
                ...     exclusion type 'temporary'
                ...     error attribution 'system'
                ...     error attribution sources: ['APPLICATION_LOG', 'SYSLOG']
                ...   node_1:
                ...     exclusion type 'confirmed'
                ...     error attribution 'hardware'
                ...     error attribution sources: ['APPLICATION_LOG', 'SYSLOG']
                ... '''
                >>> assert_equal(message_with_none.render_message(), expected_message_with_none)
      properties:
        template_id:
          default: /templates/AnomalyAttributionResult
          enum:
          - /templates/AnomalyAttributionResult
          title: Template Id
          type: string
        job_id:
          title: Job Id
          type: string
        job_attempt_index:
          title: Job Attempt Index
          type: integer
        anomaly_type:
          title: Anomaly Type
          type: string
        error_attributions:
          items:
            $ref: "#/components/schemas/ErrorAttribution"
          type: array
        user:
          title: User
          type: string
        summary:
          nullable: true
          type: string
        insight:
          nullable: true
          type: string
      required:
      - anomaly_type
      - error_attributions
      - job_attempt_index
      - job_id
      - user
      title: AnomalyAttributionResult
    AuditEvent:
      description: An audit event visible through the query API.
      example:
        summary:
          granularity: 6
          description: description
          title: title
        event_type: event_type
        payload:
          key: ""
        heimdall_job_id: heimdall_job_id
        event_level: recovery
        event_produced_at: 0
        event_producer: event_producer
      properties:
        heimdall_job_id:
          description: NVIDIA Recovery's internal identifier for the job.
          title: Heimdall Job Id
          type: string
        event_producer:
          description: The component that produced the event.
          title: Event Producer
          type: string
        event_type:
          description: The type of event.
          title: Event Type
          type: string
        event_level:
          $ref: "#/components/schemas/AuditEventLevel"
        payload:
          additionalProperties: {}
          description: Event-specific structured data.
          title: Payload
        event_produced_at:
          description: Producer emission time as Unix microseconds.
          format: int64
          title: Event Produced At
          type: integer
        summary:
          $ref: "#/components/schemas/AuditEventHumanSummary"
      required:
      - event_level
      - event_produced_at
      - event_producer
      - event_type
      - heimdall_job_id
      - payload
      - summary
      title: AuditEvent
    AuditEventHumanSummary:
      description: Human-readable descriptions of the audit event.
      example:
        granularity: 6
        description: description
        title: title
      properties:
        title:
          description: Event title -- should be similar to the audit event type.
          title: Title
          type: string
        description:
          description: Concise description of the event.
          title: Description
          type: string
        granularity:
          $ref: "#/components/schemas/AuditEventHumanSummaryGranularityClass"
      required:
      - description
      - granularity
      - title
      title: AuditEventHumanSummary
    AuditEventHumanSummaryGranularityClass:
      description: Supported granularity levels for an audit-event summary.
      enum:
      - 1
      - 11
      title: AuditEventHumanSummaryGranularityClass
      type: integer
    AuditEventIngestionResponse:
      description: Result of accepting an audit-event batch.
      example:
        partial_success:
          error_message: error_message
          rejected_events: 1
      properties:
        partial_success:
          $ref: "#/components/schemas/AuditEventPartialSuccess"
      title: AuditEventIngestionResponse
    AuditEventLevel:
      description: Supported audit event levels.
      enum:
      - recovery
      - operational
      title: AuditEventLevel
      type: string
    AuditEventPage:
      description: One page of audit events.
      example:
        cursor:
          prev_cursor: prev_cursor
          next_cursor: next_cursor
        items:
        - summary:
            granularity: 6
            description: description
            title: title
          event_type: event_type
          payload:
            key: ""
          heimdall_job_id: heimdall_job_id
          event_level: recovery
          event_produced_at: 0
          event_producer: event_producer
        - summary:
            granularity: 6
            description: description
            title: title
          event_type: event_type
          payload:
            key: ""
          heimdall_job_id: heimdall_job_id
          event_level: recovery
          event_produced_at: 0
          event_producer: event_producer
      properties:
        cursor:
          $ref: "#/components/schemas/AuditEventPageCursor"
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
      required:
      - cursor
      - items
      title: AuditEventPage
    AuditEventPageCursor:
      description: Opaque cursors for navigating between audit event pages.
      example:
        prev_cursor: prev_cursor
        next_cursor: next_cursor
      properties:
        prev_cursor:
          description: Cursor for the previous page; empty on the first page.
          title: Prev Cursor
          type: string
        next_cursor:
          description: "Cursor for the next page, or an empty string at the end."
          title: Next Cursor
          type: string
      required:
      - next_cursor
      - prev_cursor
      title: AuditEventPageCursor
    AuditEventPartialSuccess:
      description: Partial result; accepted equals submitted minus rejected.
      example:
        error_message: error_message
        rejected_events: 1
      properties:
        rejected_events:
          description: Number of rejected events.
          minimum: 1.0
          title: Rejected Events
          type: integer
        error_message:
          description: Human-readable explanation of why events were rejected.
          title: Error Message
          type: string
      required:
      - error_message
      - rejected_events
      title: AuditEventPartialSuccess
    BadNodesIsolated:
      description: |-
        Advice to exclude nodes from a job attempt has been issued.

        Examples:
            >>> message = BadNodesIsolated(
            ...     job_id="456",
            ...     job_attempt_index=7,
            ...     job_name="some-job",
            ...     bad_nodes={"aaa": ["a1", "a2"], "bbb": ["b1"]},
            ...     non_isolated_nodes={"ccc": ["c1"], "ddd": ["d1", "d2"]},
            ...     user="some-user",
            ... )
            >>> expected_message = '''\
            ... Advice to exclude nodes {'aaa': ['a1', 'a2'], 'bbb': ['b1']} from job 456(7) (job name: some-job) issued.
            ... '''
            >>> assert_equal(message.render_message(), expected_message)

            >>> expected_title = "Advice to isolate nodes for job 456 issued"
            >>> assert_equal(message.render_title(), expected_title)
      properties:
        template_id:
          default: /templates/BadNodesIsolated
          enum:
          - /templates/BadNodesIsolated
          title: Template Id
          type: string
        job_id:
          title: Job Id
          type: string
        job_attempt_index:
          title: Job Attempt Index
          type: integer
        job_name:
          title: Job Name
          type: string
        bad_nodes:
          additionalProperties:
            items:
              type: string
          title: Bad Nodes
        non_isolated_nodes:
          additionalProperties:
            items:
              type: string
          title: Non Isolated Nodes
        user:
          title: User
          type: string
      required:
      - bad_nodes
      - job_attempt_index
      - job_id
      - job_name
      - non_isolated_nodes
      - user
      title: BadNodesIsolated
    ErrorAttribution:
      description: A representation of an error attribution that's made of a JobExecutionError
        and a list of NodeEvent and GlobalEvent.
      properties:
        template_id:
          default: /partials/ErrorAttribution
          enum:
          - /partials/ErrorAttribution
          title: Template Id
          type: string
        job_execution_error:
          $ref: "#/components/schemas/JobExecutionError"
        node_events:
          items:
            $ref: "#/components/schemas/NodeEvent"
          type: array
        global_events:
          items:
            $ref: "#/components/schemas/GlobalEvent"
          nullable: true
          type: array
      required:
      - job_execution_error
      - node_events
      title: ErrorAttribution
    GlobalEvent:
      description: "A representation of a global attribution event (job-level, not\
        \ tied to specific nodes)."
      properties:
        template_id:
          default: /partials/GlobalEvent
          enum:
          - /partials/GlobalEvent
          title: Template Id
          type: string
        error_attribution:
          title: Error Attribution
          type: string
        error_attribution_sources:
          items:
            type: string
          type: array
      required:
      - error_attribution
      - error_attribution_sources
      title: GlobalEvent
    GpuThroughputDropped:
      description: |-
        Show that autonomous recovery engine has found a straggler.

        Examples:
            >>> message = GpuThroughputDropped(
            ...     job_id="456",
            ...     job_attempt_index=7,
            ...     job_name="some-job",
            ...     event_type="SILLY",
            ...     event_body="this is the event body",
            ...     user="some-user",
            ... )
            >>> expected_message = '''\
            ... Job 456(7) (some-job) `GPU throughput dropped`: `SILLY`.
            ... Log: `this is the event body`
            ... '''
            >>> assert_equal(message.render_message(), expected_message)

            >>> expected_title = "Performance alert: GPU throughput dropped for job 456"
            >>> assert_equal(message.render_title(), expected_title)

            The `event_body` is optional:

            >>> message = GpuThroughputDropped(
            ...     job_id="456",
            ...     job_attempt_index=7,
            ...     job_name="some-job",
            ...     event_type="SILLY",
            ...     user="some-user",
            ... )
            >>> expected_message = '''\
            ... Job 456(7) (some-job) `GPU throughput dropped`: `SILLY`.
            ... '''
            >>> assert_equal(message.render_message(), expected_message)
      properties:
        template_id:
          default: /templates/GpuThroughputDropped
          enum:
          - /templates/GpuThroughputDropped
          title: Template Id
          type: string
        job_id:
          title: Job Id
          type: string
        job_attempt_index:
          title: Job Attempt Index
          type: integer
        job_name:
          title: Job Name
          type: string
        event_type:
          title: Event Type
          type: string
        event_body:
          nullable: true
          type: string
        user:
          title: User
          type: string
      required:
      - event_type
      - job_attempt_index
      - job_id
      - job_name
      - user
      title: GpuThroughputDropped
    HTTPValidationError:
      example:
        detail:
        - msg: msg
          loc:
          - ValidationError_loc_inner
          - ValidationError_loc_inner
          input: ""
          ctx: "{}"
          type: type
        - msg: msg
          loc:
          - ValidationError_loc_inner
          - ValidationError_loc_inner
          input: ""
          ctx: "{}"
          type: type
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
      title: HTTPValidationError
    InvalidJobConfig:
      description: |-
        Notify user that the job config is not compatible with NVIDIA Recovery's requirements.

        Examples:
            >>> message = InvalidJobConfig(
            ...     job_id="456",
            ...     job_attempt_index=0,
            ...     job_name="some-job",
            ...     reason="Invalid job log file name",
            ...     user="some-person",
            ... )
            >>> expected_message = '''\
            ... Job 456(0) (job name: some-job) has invalid configuration that's not compatible with NVIDIA Recovery's requirements.
            ... Reason: Invalid job log file name.
            ... '''
            >>> assert_equal(message.render_message(), expected_message)

            >>> expected_title = "Invalid configuration for job 456"
            >>> assert_equal(message.render_title(), expected_title)
      properties:
        template_id:
          default: /templates/InvalidJobConfig
          enum:
          - /templates/InvalidJobConfig
          title: Template Id
          type: string
        job_id:
          title: Job Id
          type: string
        job_attempt_index:
          title: Job Attempt Index
          type: integer
        job_name:
          title: Job Name
          type: string
        reason:
          title: Reason
          type: string
        user:
          title: User
          type: string
      required:
      - job_attempt_index
      - job_id
      - job_name
      - reason
      - user
      title: InvalidJobConfig
    Items_NotificationPublic_:
      example:
        items:
        - created_time: 2000-01-23T04:56:07.000+00:00
          template_data:
            job_id: job_id
            template_id: /partials/JobRepr
            job_attempt_index: 0
          via_callback: PENDING
          job_id: job_id
          recipient: recipient
