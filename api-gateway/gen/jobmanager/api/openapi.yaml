    Advice-Input:
      description: |-
        Represents advice for a job from the NVIDIA Recovery system.

        This model matches the NVIDIA Recovery Go client schema (flattened structure) rather than
        the CRD structure (nested spec). The API returns a flattened version where jobId and
        restartCount are at the top level alongside the advice recommendation and issues.

        This is the public facing model returned from the job manager's REST API.
      properties:
        id:
          title: Id
          type: string
        visible:
          default: false
          title: Visible
          type: boolean
        jobId:
          title: Jobid
          type: string
        restartCount:
          title: Restartcount
          type: integer
        schedulerMetadata:
          additionalProperties: {}
          default: {}
          title: Schedulermetadata
        advice:
          $ref: "#/components/schemas/AdviceRecommendation"
        generation:
          default: 1
          minimum: 1.0
          title: Generation
          type: integer
        desiredStateChangedAt:
          format: date-time
          nullable: true
          type: string
        reconciliationStatus:
          $ref: "#/components/schemas/AdviceReconciliationStatus"
        issues:
          items:
            $ref: "#/components/schemas/Issue-Input"
          nullable: true
          type: array
        factAttribution:
          additionalProperties: {}
          nullable: true
        recoveryContext:
          $ref: "#/components/schemas/RecoveryContext"
        createdAt:
          format: date-time
          nullable: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          type: string
      required:
      - advice
      - id
      - jobId
      - restartCount
      title: Advice
    Advice-Output:
      description: |-
        Represents advice for a job from the NVIDIA Recovery system.

        This model matches the NVIDIA Recovery Go client schema (flattened structure) rather than
        the CRD structure (nested spec). The API returns a flattened version where jobId and
        restartCount are at the top level alongside the advice recommendation and issues.

        This is the public facing model returned from the job manager's REST API.
      example:
        generation: 1
        factAttribution:
          key: ""
        visible: false
        restartCount: 6
        advice:
          nodeConstraints:
            exclusions:
            - exclusions
            - exclusions
