openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
servers:
- url: /
paths:
  /metrics:
    get:
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Metrics
  /status:
    get:
      description: Endpoint to indicate if job manager is properly functioning or
        not.
      operationId: get_status
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get Status
  /job_status/{job_id}:
    get:
      description: |-
        Retrieve the execution status of a specific job.

        Parameters:
            job_id (str):
                The unique identifier of the job to retrieve the status for.
            job_attempt_index (Optional[int], optional):
                The specific attempt index of the job, if applicable. If not provided,
                the latest or most relevant attempt is used by default.

        Returns:
            SlurmJobExecutionStatus:
                An object of SlurmJobExecutionStatus representing the current execution status of the specified job.
      operationId: get_job_status
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
        style: simple
      - description: The job_attempt_index query parameter.
        explode: true
        in: query
        name: job_attempt_index
        required: false
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlurmJobExecutionStatus-Output"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Job Status
  /job_anomalies/{job_id}:
    get:
      description: |-
        Retrieve a list of anomalies associated with a specific job.

        Parameters:
            job_id (str):
                The unique identifier of the job.
            job_attempt_index (Optional[int], optional):
                The index of the job attempt to retrieve anomalies for.
                If not provided, anomalies for the most relevant or latest attempt are returned.

        Returns:
            list[JobAnomaly]:
                A list of anomalies detected for the specified job attempt.
      operationId: get_job_anomalies
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
        style: simple
      - explode: true
        in: query
        name: job_attempt_index
        required: false
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/JobAnomaly"
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Job Anomalies
  /workflows:
    get:
      description: Retrieve workflows grouped by their canonical persisted workflow
        ID.
      operationId: get_workflows
      parameters:
      - description: The maximum number of records to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: The maximum number of records to return.
          title: Limit
          type: integer
        style: form
      - description: The offset to start the records from.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: The offset to start the records from.
          title: Offset
          type: integer
        style: form
      - description: The workflow ID filter.
        explode: true
        in: query
        name: workflow-id
        required: false
        schema:
          maxLength: 256
          minLength: 1
          nullable: true
          type: string
        style: form
      - description: "How to match workflow_id: 'prefix' (default, case-insensitive\
          \ starts with), 'exact' (case-sensitive exact match), or 'fuzzy' (case-insensitive\
          \ substring match)."
        explode: true
        in: query
        name: workflow_id_match
        required: false
        schema:
          default: prefix
          description: "How to match workflow_id: 'prefix' (default, case-insensitive\
            \ starts with), 'exact' (case-sensitive exact match), or 'fuzzy' (case-insensitive\
            \ substring match)."
          enum:
          - prefix
          - exact
          - fuzzy
          title: Workflow Id Match
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWorkflowsResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Workflows
  /job_groups:
    get:
      description: |-
        Query aggregated job group metadata.

        GET /job_groups
        Retrieves a list of job group metadata derived from job execution records, with optional filtering,
        pagination, and sorting.

        Query Parameters:
        job_group_id (str, optional):
        Filter by a specific job group ID.

        user (str, optional):
        Filter by the username who submitted the jobs.

        limit (int, default=50):
        Maximum number of records to return.

        offset (int, default=0):
        Number of records to skip (used for pagination).

        sort_by (str, optional):
        Comma-separated list of fields to sort by. Each field can specify order as asc or desc.
        Valid fields: job_group_id, unique_job_count, total_job_attempt_count.
        Example: total_job_attempt_count:desc

        Returns:
        A JobGroupStatuses object containing the list of job group metadata and total count.
      operationId: get_job_groups
      parameters:
      - description: Filter by a specific job group ID.
        explode: true
        in: query
        name: job_group_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The user filter.
        explode: true
        in: query
        name: user
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The maximum number of records to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: The maximum number of records to return.
          title: Limit
          type: integer
        style: form
      - description: The offset to start the records from.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: The offset to start the records from.
          title: Offset
          type: integer
        style: form
      - description: "Comma separated list of fields to sort by. Valid fields: job_group_id,\
          \ unique_job_count, total_job_attempt_count. Format: 'field:order' pairs,\
          \ e.g., 'total_job_attempt_count:desc'."
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobGroupStatuses"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Job Groups
  /jobs:
    get:
      description: |-
        Query all available jobs.

        GET /jobs
        Retrieves a list of job execution records with optional filtering, pagination, and sorting.

        This endpoint returns job execution data based on various query parameters such as job ID, user, job name, state, and time-based filters. The response includes full job records by default.

        Query Parameters:
        complete_data (bool, deprecated):
        Deprecated. Previously used to toggle between full and partial job records. Now always returns full job records.

        job_id (str, optional):
        Filter results by a specific job ID.

        job_attempt_index (str, optional):
        Filter by job attempt index. Note: Cannot be used on its own—must be combined with job_id.

        user (str, optional):
        Filter results by the username who submitted the job.

        job_name (str, optional):
        Filter results by the job name.

        workflow_id (str, optional):
        Filter results by the exact canonical workflow ID.

        job_name_match (str, optional):
        How to match job_name: "prefix" (default, starts with) or "exact".

        state (str, optional):
        Filter by job state (e.g., Slurm job states).
        Cannot be used together with completed_jobs.

        completed_jobs (bool, optional):
        Filter by job completion status.
        If True, returns completed jobs; if False, returns running jobs.
        Cannot be used with state.

        reconciliation_eligible_jobs (bool, default=False):
        Return the state-based candidate set used to seed scheduler reconciliation:
        every non-final job plus failure-like terminal jobs. COMPLETED and REQUEUED
        are excluded because their recovery is driven by exact-attempt Advice.
        Cannot be used with state or completed_jobs.

        offset (int, default=0):
        Number of records to skip (used for pagination).

        time_filter_target (JobTimeFilterTarget, optional):
        Specifies which job time field (created, started, etc.) to filter by.
        Requires either time_filter_from or time_filter_to.

        time_filter_from (datetime, optional):
        Start of time range for the selected time filter target.

        time_filter_to (datetime, optional):
        End of time range for the selected time filter target.

        sort_by (str, optional):
        Comma-separated list of fields to sort by. Each field can specify order as asc or desc.
        Example: job_id:asc,job_attempt_index:desc

        job_group_id (str, optional):
        Filter by job group ID. Returns all job attempts belonging to this job group.

        include_job_group_attempts (bool, default=True):
        When job_group_id is not provided, controls whether to include job attempts that belong to a job group.
        When False, only returns standalone job attempts (not part of any job group).
        Ignored when job_group_id is provided.

        Returns:
        A JobExecutionStatuses object containing the list of job execution records that match the filter criteria.
      operationId: get_jobs
      parameters:
      - deprecated: true
        description: "Deprecated query parameter, it used to control whether full\
          \ job records will be returned or not, now it always returns full job records."
        explode: true
        in: query
        name: complete_data
        required: false
        schema:
          default: false
          deprecated: true
          description: "Deprecated query parameter, it used to control whether full\
            \ job records will be returned or not, now it always returns full job\
            \ records."
          title: Complete Data
          type: boolean
        style: form
      - description: The job_id filter.
        explode: true
        in: query
        name: job_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The job_attempt_index filter. (Cannot be used by itself)
        explode: true
        in: query
        name: job_attempt_index
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "The heimdall_job_id (UUID) filter. If provided, other job_id/job_attempt_index\
          \ filters are ignored."
        explode: true
        in: query
        name: heimdall_job_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The user filter.
        explode: true
        in: query
        name: user
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The job_name filter.
        explode: true
        in: query
        name: job_name
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The exact workflow_id filter.
        explode: true
        in: query
        name: workflow_id
        required: false
        schema:
          maxLength: 256
          minLength: 1
          nullable: true
          type: string
        style: form
      - description: "How to match job_name: 'prefix' (default, case-insensitive starts\
          \ with), 'exact' (case-sensitive exact match), or 'fuzzy' (case-insensitive\
          \ substring match)."
        explode: true
        in: query
        name: job_name_match
        required: false
        schema:
          default: prefix
          description: "How to match job_name: 'prefix' (default, case-insensitive\
            \ starts with), 'exact' (case-sensitive exact match), or 'fuzzy' (case-insensitive\
            \ substring match)."
          enum:
          - prefix
          - exact
          - fuzzy
          title: Job Name Match
          type: string
        style: form
      - description: "The slurm job_state filter, cannot be specified with completed_jobs"
        explode: true
        in: query
        name: state
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: The maximum number of records to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: The maximum number of records to return.
          title: Limit
          type: integer
        style: form
      - description: The offset to start the records from.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: The offset to start the records from.
          title: Offset
          type: integer
        style: form
      - description: "If specified, either return completed or running jobs, cannot\
          \ be specified together with state"
        explode: true
        in: query
        name: completed_jobs
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - description: "Return jobs that can seed scheduler reconciliation: all non-final\
          \ jobs plus failure-like terminal jobs. COMPLETED and REQUEUED jobs are\
          \ excluded because their recovery is driven by exact-attempt Advice. Cannot\
          \ be specified together with state or completed_jobs."
        explode: true
        in: query
        name: reconciliation_eligible_jobs
        required: false
        schema:
          default: false
          description: "Return jobs that can seed scheduler reconciliation: all non-final\
            \ jobs plus failure-like terminal jobs. COMPLETED and REQUEUED jobs are\
            \ excluded because their recovery is driven by exact-attempt Advice. Cannot\
            \ be specified together with state or completed_jobs."
          title: Reconciliation Eligible Jobs
          type: boolean
        style: form
      - description: "Filter jobs by this job time, requires either from or to time\
          \ filter times"
        explode: true
        in: query
        name: time_filter_target
        required: false
        schema:
          $ref: "#/components/schemas/JobTimeFilterTarget"
        style: form
      - description: The job time filter start time
        explode: true
        in: query
        name: time_filter_from
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - description: The job time filter end time
        explode: true
        in: query
        name: time_filter_to
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - description: "Comma separated list of fields to sort by. The sort will happen\
          \ in the same order as the order of the fields. Valid input is a comma-separated\
          \ list of 'field:order' pairs.e.g., 'job_id:asc, job_attempt_index:desc'."
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Filter by job group ID. Returns all job attempts belonging to
          this job group.
        explode: true
        in: query
        name: job_group_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "When job_group_id is not provided, controls whether to include\
          \ job attempts that belong to a job group. Defaults to True. When False,\
          \ only returns standalone job attempts. Ignored when job_group_id is provided."
        explode: true
        in: query
        name: include_job_group_attempts
        required: false
        schema:
          default: true
          description: "When job_group_id is not provided, controls whether to include\
            \ job attempts that belong to a job group. Defaults to True. When False,\
            \ only returns standalone job attempts. Ignored when job_group_id is provided."
          title: Include Job Group Attempts
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobExecutionStatuses"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Jobs
    post:
      description: |-
        Create or update a job execution record.

        This endpoint accepts a job execution status and either creates a new record
        if one doesn't exist, or updates the existing record if it does. The job is
        identified by the combination of job_id and job_attempt_index.

        This endpoint is idempotent - calling it multiple times with the same data
        will update the existing record rather than failing or creating duplicates.

        Args:
            job: The job execution status to upsert.

        Returns:
            SlurmJobExecutionStatus: The created or updated job execution status.

        Raises:
            HTTPException: If validation fails or a database error occurs.
      operationId: post_jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlurmJobExecutionStatus-Input"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlurmJobExecutionStatus-Output"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Post Jobs
  /advice:
    get:
      description: |-
        Retrieve a list of advice for jobs.

        This endpoint returns advice recommendations from the NVIDIA Recovery system for jobs
        that have been analyzed for issues such as crashes, hangs, or stragglers.

        Parameters:
            page_size (int):
                The maximum number of advice items to return per page. Must be between 1 and 1000.
                Default is 50.
            page_token (str, optional):
                A token representing the starting point for the next page of results.
                If not provided, the first page is returned. The token is a base64-encoded offset value.
            job_id (str, optional):
                Filter advice by job_id.
            include_hidden (bool):
                If True, include advice records that are not yet visible (soft-deleted or under construction).
                Default is False (only visible advice is returned).

        Returns:
            ListAdviceResponse:
                A response containing a list of advice items and an optional nextPageToken
                for pagination.
      operationId: get_advice
      parameters:
      - description: Number of items per page.
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          description: Number of items per page.
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - description: Token for the next page of results.
        explode: true
        in: query
        name: page_token
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Filter advice by job_id.
        explode: true
        in: query
        name: job_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "If true, include hidden/non-visible advice records."
        explode: true
        in: query
        name: include_hidden
        required: false
        schema:
          default: false
          description: "If true, include hidden/non-visible advice records."
          title: Include Hidden
          type: boolean
        style: form
      - description: Return ordinary advice created at or after this time while retaining
          durable states.
        explode: true
        in: query
        name: created_after
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return only advice that can still require reconciliation.
        explode: true
        in: query
        name: only_active
        required: false
        schema:
          default: false
          description: Return only advice that can still require reconciliation.
          title: Only Active
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdviceResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Advice
    post:
      description: |-
        Create or update an advice record.

        This endpoint accepts an advice object and either creates a new record
        if one doesn't exist, or updates the existing record if it does. The advice
        is identified by its id (heimdall_id).

        This endpoint is idempotent - calling it multiple times with the same data
        will update the existing record rather than failing or creating duplicates.

        Parameters:
            advice (Advice):
                The advice record to upsert.

        Returns:
            Advice:
                The created or updated advice record.

        Raises:
            HTTPException: 409 if advice ID doesn't match job record's canonical heimdall_job_id,
                400 on validation error, 500 on server error.
      operationId: post_advice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Advice-Input"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice-Output"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Post Advice
  /advice/{heimdall_id}/reconciliation-status:
    put:
      description: Record one generation-scoped reconciliation observation for Advice.
      operationId: put_advice_reconciliation_status
      parameters:
      - explode: false
        in: path
        name: heimdall_id
        required: true
        schema:
          title: Heimdall Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceReconciliationStatus"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceReconciliationStatus"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Put Advice Reconciliation Status
  /recovery/sequences:
    get:
      description: Read canonical context for an exact scoped operation without creating
        it.
      operationId: get_recovery_sequence
      parameters:
      - explode: true
        in: query
        name: scheduler_system
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Scheduler System
          type: string
        style: form
      - explode: true
        in: query
        name: scheduler_scope
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Scheduler Scope
          type: string
        style: form
      - explode: true
        in: query
        name: job_id
        required: true
        schema:
          maxLength: 256
          minLength: 1
          title: Job Id
          type: string
        style: form
      - explode: true
        in: query
        name: source_attempt_index
        required: true
        schema:
          minimum: 0
          title: Source Attempt Index
          type: integer
        style: form
      - explode: true
        in: query
        name: operation
        required: true
        schema:
          $ref: "#/components/schemas/RecoveryOperation"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRecoverySequenceResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Recovery Sequence
  /recovery/milestones:
    post:
      description: Idempotently record one scheduler-action completion occurrence.
      operationId: record_recovery_milestone
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRecoveryMilestoneRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordRecoveryMilestoneResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Record Recovery Milestone
  /advice/{heimdall_id}:
    delete:
      description: |-
        Delete an advice record by its NVIDIA Recovery ID.

        Parameters:
            heimdall_id (str):
                The UUID of the advice record to delete.

        Returns:
            Response:
                204 No Content on successful deletion.

        Raises:
            HTTPException: 404 if not found, 400 if invalid ID format, 500 on server error.
      operationId: delete_advice
      parameters:
      - explode: false
        in: path
        name: heimdall_id
        required: true
        schema:
          title: Heimdall Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Delete Advice
    get:
      description: |-
        Retrieve a single advice record by its NVIDIA Recovery ID.

        Parameters:
            heimdall_id (str):
                The UUID of the advice record assigned by NVIDIA Recovery.

        Returns:
            Advice:
                The advice record if found.

        Raises:
            HTTPException: 404 if not found, 400 if invalid ID format, 500 on server error.
