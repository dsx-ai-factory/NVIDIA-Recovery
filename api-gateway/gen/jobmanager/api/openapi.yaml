          type: string
        style: form
      - description: Filter by parent job identifier (job ID or job name).
        explode: true
        in: query
        name: dependency_job_identifier
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Filter by parent identifier type ('id' or 'name'). Required when
          dependency_job_identifier is provided.
        explode: true
        in: query
        name: dependency_job_identifier_type
        required: false
        schema:
          nullable: true
