        issues:
        - issueType: issueType
          detectedBy: detectedBy
          remediationActions:
          - actionType: actionType
            reason: reason
            resourceDetails:
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            timestamp: 2000-01-23T04:56:07.000+00:00
          - actionType: actionType
            reason: reason
            resourceDetails:
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            timestamp: 2000-01-23T04:56:07.000+00:00
          relevantLogLines:
          - relevantLogLines
          - relevantLogLines
          timestamp: 2000-01-23T04:56:07.000+00:00
        - issueType: issueType
          detectedBy: detectedBy
          remediationActions:
          - actionType: actionType
            reason: reason
            resourceDetails:
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            timestamp: 2000-01-23T04:56:07.000+00:00
          - actionType: actionType
            reason: reason
            resourceDetails:
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            - resourceId: resourceId
              details: details
              resourceType: resourceType
            timestamp: 2000-01-23T04:56:07.000+00:00
          relevantLogLines:
          - relevantLogLines
          - relevantLogLines
          timestamp: 2000-01-23T04:56:07.000+00:00
        jobId: jobId
        desiredStateChangedAt: 2000-01-23T04:56:07.000+00:00
        createdAt: 2000-01-23T04:56:07.000+00:00
