        max_requeue_times:
          nullable: true
          type: integer
        requeue_on_completion:
          nullable: true
          type: boolean
        log_file_paths_shared_across_attempts:
          default: false
          title: Log File Paths Shared Across Attempts
          type: boolean
        nvrx:
          nullable: true
          type: string
        anomaly_detection_config:
          $ref: "#/components/schemas/AnomalyDetectionConfig"
        dag_dependencies:
          items:
            $ref: "#/components/schemas/DagDependencyStep"
          nullable: true
          type: array
        dag_action:
          $ref: "#/components/schemas/DagActionEnum"
      title: ApsSlurmJobSpec
    ApsSlurmJobSpec-Output:
      description: |-
        APS Slurm Job Spec, today this spec should be passed to APS as a JSON string included in the "comment" of a Slurm
        job.

        Attributes:
            workflow_id (Optional[str]): The workflow this Slurm job belongs to.
            workflow_name (Optional[str]): Deprecated alias for workflow_id.
            environment (Optional[str]): The APS/NVIDIA Recovery environment that the job should be managed by, if not specified,
                the job will be managed by the "prod" environment.
            auto_resume_mode (Optional[AutoResumeModeEnum]): The auto resume mode for the job.
            max_requeue_times (Optional[PositiveInt]): The max number of requeue that will happen to the job. Only
                applicable when auto_resume_mode is set to REQUEUE. If not specified, the system wide max job attempt limit
                will be used. Note that the max requeue times will be capped at the system wide limit too.
            requeue_on_completion (Optional[bool]): Whether to requeue the job on normal completion. Default is None which
                means it follows the system wide default. Setting it to either True or False will override the system wide
                default. Only meaningful when auto_resume_mode is set to REQUEUE.
            log_file_paths_shared_across_attempts (bool): Whether requeued attempts intentionally write to the same log
                files. Defaults to False, which requires unique per-attempt paths and protects event correlation from
                stale paths returned by Slurm during a requeue race.
            nvrx (Optional[bool]): Whether the job is enabled for NVRX. Default is "disabled".
            anomaly_detection_config (AnomalyDetectionConfig): Anomaly detection configuration. Defaults to
                AnomalyDetectionConfig() (all log-based detections enabled with default thresholds). Use
                AnomalyDetectionConfig(log_based_crash_enabled=False) to generate a CRASH anomaly immediately when the
                job enters FAILED state. Use AnomalyDetectionConfig(log_based_timeout_enabled=False) to suppress
                log-based no-output (HANGNOOUTPUT) anomalies, or override
                log_based_timeout_threshold_pretraining / log_based_timeout_threshold_trainingloop to tune the
                per-phase silence window before a HANGNOOUTPUT anomaly may fire.
            dag_dependencies (Optional[list[DagDependencyStep]]): DAG dependencies that must be satisfied before this
                job can run. Each step specifies a dependency job and a trigger condition. The current job will only be
                eligible for execution when all dependencies are met.
            dag_action (Optional[DagActionEnum]): The action to take on this job after all its dag_dependencies are
                satisfied. For example, RELEASE will release the job so it becomes eligible for scheduling.
      example:
        workflow_id: workflow_id
        environment: environment
        workflow_name: workflow_name
        log_file_paths_shared_across_attempts: false
        max_requeue_times: 2
        anomaly_detection_config:
          log_based_timeout_threshold_trainingloop: 9
          log_based_timeout_enabled: true
          log_based_timeout_threshold_pretraining: 7
          log_based_crash_enabled: true
        auto_resume_mode: singleton_dependency
        requeue_on_completion: true
        nvrx: nvrx
        dag_action: release
        dag_dependencies:
        - trigger: completed
          target:
            name: name
            type: name
        - trigger: completed
          target:
            name: name
            type: name
      properties:
        workflow_id:
          nullable: true
          type: string
        workflow_name:
          nullable: true
          type: string
        environment:
          nullable: true
          type: string
        auto_resume_mode:
          $ref: "#/components/schemas/AutoResumeModeEnum"
        max_requeue_times:
          nullable: true
          type: integer
        requeue_on_completion:
          nullable: true
          type: boolean
        log_file_paths_shared_across_attempts:
          default: false
          title: Log File Paths Shared Across Attempts
          type: boolean
        nvrx:
          nullable: true
          type: string
        anomaly_detection_config:
          $ref: "#/components/schemas/AnomalyDetectionConfig"
        dag_dependencies:
          items:
            $ref: "#/components/schemas/DagDependencyStep"
          nullable: true
          type: array
        dag_action:
          $ref: "#/components/schemas/DagActionEnum"
      title: ApsSlurmJobSpec
    AutoResumeModeEnum:
      description: |-
        This enum class defines the auto resume mode for the job.

        SINGLETON_DEPENDENCY: NVIDIA Recovery will use the existing singleton dependency jobs to resume the progress.
        REQUEUE: NVIDIA Recovery will requeue the same job to resume the progress.
      enum:
      - singleton_dependency
      - requeue
      title: AutoResumeModeEnum
      type: string
    DagActionEnum:
      description: |-
        The action to take on the target job in a DAG step.

        RELEASE: Release the target job so it becomes eligible for scheduling.
      enum:
      - release
      title: DagActionEnum
      type: string
    DagDependencyReasonCodeEnum:
      description: Machine-readable explanation for the latest DAG dependency evaluation.
      enum:
      - WAITING_FOR_PARENT_REGISTRATION
      - WAITING_FOR_PARENT_COMPLETION
      - DEPENDENCY_SATISFIED_WAITING_FOR_OTHERS
      - PARENT_NAME_AMBIGUOUS
      - PARENT_TERMINATED
      title: DagDependencyReasonCodeEnum
      type: string
    DagDependencyResponse:
      description: |-
        Public-facing data model for a DAG dependency record.

        Each record represents a dependency relationship between a dependent (child) job and a dependency (parent) job.
        When the parent job satisfies the trigger condition, the dependent job becomes eligible for the specified action.
      example:
        reason_code: WAITING_FOR_PARENT_REGISTRATION
        action_time: 2000-01-23T04:56:07.000+00:00
        dependent_job_action: dependent_job_action
        dependency_trigger_condition: dependency_trigger_condition
        reason_message: reason_message
        last_evaluated_at: 2000-01-23T04:56:07.000+00:00
        dependent_job_id: dependent_job_id
        dependency_job_identifier_type: dependency_job_identifier_type
        dependency_job_identifier: dependency_job_identifier
        reason_details:
          key: ""
        action_status: action_status
      properties:
        dependent_job_id:
          title: Dependent Job Id
          type: string
        dependent_job_action:
          title: Dependent Job Action
          type: string
        dependency_job_identifier:
          title: Dependency Job Identifier
          type: string
        dependency_job_identifier_type:
          title: Dependency Job Identifier Type
          type: string
        dependency_trigger_condition:
          title: Dependency Trigger Condition
          type: string
        action_status:
          description: "Dependency action status: not_eligible, in_progress, successful,\
            \ failed, or aborted. Aborted is absorbing and means a parent reached\
            \ terminal Advice, so this gate cannot release."
          title: Action Status
          type: string
        action_time:
          format: date-time
          nullable: true
          type: string
        reason_code:
          $ref: "#/components/schemas/DagDependencyReasonCodeEnum"
        reason_message:
          nullable: true
          type: string
        reason_details:
          additionalProperties: {}
          nullable: true
        last_evaluated_at:
          format: date-time
          nullable: true
          type: string
      required:
      - action_status
      - dependency_job_identifier
      - dependency_job_identifier_type
      - dependency_trigger_condition
      - dependent_job_action
      - dependent_job_id
      title: DagDependencyResponse
    DagDependencyStep:
      description: |-
        A single DAG dependency step that describes a dependency that must meet a trigger condition
        before the current job can run.

        Attributes:
            target (JobReference): The dependency job, identified by name or id.
            trigger (DagTriggerConditionEnum): The condition that triggers this step. Defaults to COMPLETED.
      example:
        trigger: completed
        target:
          name: name
          type: name
      properties:
        target:
          $ref: "#/components/schemas/Target"
        trigger:
          $ref: "#/components/schemas/DagTriggerConditionEnum"
      required:
