[project]
name = "recovery-libs"
version = "0.1.0"
description = "Shared schema, storage, and client libraries for NVIDIA Recovery services."
readme = "docs/README-schema.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=49.0.0,<50",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "boto3>=1.26.19",
    "pydantic>=2.7.1",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.34",
    "pymysql>=1.1.1",
    "typing-extensions>=4.11.0",
    "pytz>=2024.2",
    "prometheus-client>=0.20.0",
    "cachetools>=4.2.1,<6.0",
    "opentelemetry-api>=1.30.0,<2.0.0",
    "opentelemetry-sdk>=1.30.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.30.0,<2.0.0",
]

[project.scripts]
e2e-stack-gate = "recovery_libs.testing.stack_gate:main"

[project.optional-dependencies]
testing = ["backoff>=2.2.1,<3", "paramiko>=3.5,<5", "pydantic-settings>=2.13,<3", "testcontainers[mysql]>=4,<5"]
e2e = ["tabulate>=0.9"]

[dependency-groups]
dev = [
    "pytest-cov",
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "types-requests",
    "types-pyyaml",
    "types-cachetools",
    "types-pytz",
    "types-python-dateutil",
    "mypy",
    "recovery-libs[testing]",
]

[tool.pytest.ini_options]
markers = [
    "nightly: tests excluded from pull requests and main pushes; included in nightly and tagged-release suites",
    "regression: tests that reproduce a specific fixed bug, guarding against reintroduction",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "recovery_libs/storage/alembic/",
]

[[tool.mypy.overrides]]
module = "recovery_libs.notifications_client.*"
ignore_errors = true

# Hatchling's default wheel build otherwise bundles every "tests"/"test" directory
# under recovery_libs, including test-only fixtures and data files, into the
# production wheel. recovery_libs/testing/ is the one exception: it's shipped
# deliberately, as an installable optional-dependency surface (see
# [project.optional-dependencies] testing above) for other packages' own tests.
[tool.hatch.build.targets.wheel]
exclude = [
    "recovery_libs/tests/**",
    "recovery_libs/**/tests/**",
    "recovery_libs/**/test/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
